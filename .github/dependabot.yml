version: 2
updates:
  # Il motore di trascrizione (whisper.cpp via whisper-rs): i miglioramenti arrivano con la release dopo.
  - package-ecosystem: cargo
    directory: /trascrivi
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      librerie:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      librerie:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
