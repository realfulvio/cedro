name: Linux

# Compila e prova Cedro per Linux (x86-64) e crea il pacchetto tar.gz e i motori di trascrizione.
# Pubblicare: parte da solo all'inizio del workflow «Windows ARM64» (in parallelo) quando pubblica una release, oppure
# Actions → Linux → Run workflow con il tag (per esempio v0.18.1): il tar.gz va nella release v<versione>,
# i motori nella pre-release «motori-v<versione>», e nelle note compare la riga per Linux.
# Dove gira: sul minipc di casa (runner con l'etichetta cedro-linux, dentro un contenitore Ubuntu 24.04 con
# le cartelle di compilazione che restano tra un giro e l'altro) se è acceso e libero; altrimenti sui runner
# di GitHub, come prima. Lo decide il job «scegli» con tools/sonda-runner.sh.

on:
  push:
    branches: ["claude/**"]
    paths: ["Cargo.*", "src/**", "resources/**", "vendor/**", "trascrivi/**", "riassumi/**", "installer/**", "examples/**", "build.rs", ".github/workflows/linux.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag della release a cui aggiungere Linux (vuoto = solo prova)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

# Nel contenitore del minipc la shell predefinita sarebbe sh: si usa bash come sui runner di GitHub.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  DEBIAN_FRONTEND: noninteractive

jobs:
  scegli:
    name: Sceglie dove compilare (minipc o GitHub)
    runs-on: ubuntu-latest
    outputs:
      locale: ${{ steps.sonda.outputs.locale }}
    steps:
      - uses: actions/checkout@v4
      - id: sonda
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SONDA_REF: ${{ github.ref_name }}
        run: tools/sonda-runner.sh cedro-linux

  # Se trascrivi/ e riassumi/ sono uguali all'ultima release (cambia solo la loro versione) i motori non si
  # ricompilano né si riprovano: si riprendono da «motori-<tag precedente>» e si rinominano (12 compilazioni e la
  # prova del modello vero risparmiate). Nel dubbio, o senza tag, si compila tutto come prima.
  invarianti:
    name: Controlla se i motori sono cambiati
    runs-on: ubuntu-latest
    outputs:
      riuso: ${{ steps.conf.outputs.riuso }}
      precedente: ${{ steps.conf.outputs.precedente }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ inputs.tag != '' }}
        with:
          ref: ${{ inputs.tag }}
      - id: conf
        if: ${{ inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          riuso=false; prec=""
          prec=$(gh release view --json tagName --jq .tagName 2>/dev/null) || prec=""
          if [ -z "$prec" ] || [ "$prec" = "$TAG" ]; then
            echo "Nessuna release precedente utilizzabile ($prec): si compila tutto"
          elif ! python3 tools/motori-invariati.py "$prec"; then
            echo "Sorgenti dei motori cambiati: si compila tutto"
          else
            have=$(gh release view "motori-$prec" --json assets --jq '.assets[].name' 2>/dev/null || true)
            ok=true
            for m in trascrivi riassumi; do for v in base avx2 avxvnni avx512 avx512vnni vulkan; do
              grep -qxF "cedro-$m-${prec#v}-linux-x64-$v" <<<"$have" || { echo "manca cedro-$m-${prec#v}-linux-x64-$v in motori-$prec"; ok=false; }
            done; done
            if $ok; then riuso=true; echo "Motori da riprendere da motori-$prec"; else echo "Motori della release precedente incompleti: si compila tutto"; fi
          fi
          echo "riuso=$riuso" >> "$GITHUB_OUTPUT"
          echo "precedente=$prec" >> "$GITHUB_OUTPUT"
  app:
    name: Cedro (build, prove, tar.gz)
    needs: scegli
    runs-on: ${{ needs.scegli.outputs.locale == 'true' && fromJSON('["self-hosted", "cedro-linux"]') || 'ubuntu-24.04' }}
    # Sul minipc: stesso sistema dei runner di GitHub (Ubuntu 24.04, quindi la stessa glibc minima per chi
    # installa), con un volume che tiene Rust, i pacchetti scaricati e le cartelle di compilazione.
    container:
      image: ${{ needs.scegli.outputs.locale == 'true' && 'ubuntu:24.04' || '' }}
      volumes: ["cedro-cache:/cache"]
    steps:
      - name: Strumenti di base del contenitore (solo sul minipc)
        if: ${{ needs.scegli.outputs.locale == 'true' }}
        run: |
          rm -f /etc/apt/apt.conf.d/docker-clean
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' > /etc/apt/apt.conf.d/10-cedro-tieni
          mkdir -p /cache/apt-${{ github.job }}/partial && rm -rf /var/cache/apt/archives && ln -s /cache/apt-${{ github.job }} /var/cache/apt/archives
          apt-get update
          apt-get install -y --no-install-recommends sudo ca-certificates curl git build-essential python3 python-is-python3 xz-utils file util-linux

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Rust e cartelle che restano (solo sul minipc)
        if: ${{ needs.scegli.outputs.locale == 'true' }}
        run: tools/prepara-contenitore.sh target-app

      - name: Librerie di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libdbus-1-dev libasound2-dev pkg-config cmake clang

      - uses: Swatinem/rust-cache@v2
        if: ${{ needs.scegli.outputs.locale != 'true' }}

      - name: Prove adattatori web
        run: python resources/web-adapters/test_adapters.py

      - name: Prove
        run: cargo test --release --lib

      - name: Firma con una chiavetta finta (SoftHSM2, PKCS#11)
        run: |
          sudo apt-get install -y --no-install-recommends softhsm2 opensc openssl
          source tools/prova-softhsm.sh
          cargo test --release --lib firma::pkcs11 -- --nocapture

      - name: Pacchetto tar.gz
        run: installer/build-linux.sh -o dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-tar
          path: dist/cedro-*-linux-x64.tar.gz

      # Nel contenitore si lavora come root: i file lasciati nella cartella del runner tornano all'utente
      # del minipc, altrimenti il giro dopo non riesce a ripulirla.
      - name: Restituisce i file all'utente del minipc
        if: ${{ always() && needs.scegli.outputs.locale == 'true' }}
        run: chown -R 1000:1000 "$GITHUB_WORKSPACE" "$RUNNER_TEMP" || true

  motori:
    name: Motori di trascrizione (processore e Vulkan)
    needs: [scegli, invarianti]
    if: ${{ needs.invarianti.outputs.riuso != 'true' }}
    runs-on: ${{ needs.scegli.outputs.locale == 'true' && fromJSON('["self-hosted", "cedro-linux"]') || 'ubuntu-24.04' }}
    # Sul minipc: stesso sistema dei runner di GitHub (Ubuntu 24.04, quindi la stessa glibc minima per chi
    # installa), con un volume che tiene Rust, i pacchetti scaricati e le cartelle di compilazione.
    container:
      image: ${{ needs.scegli.outputs.locale == 'true' && 'ubuntu:24.04' || '' }}
      volumes: ["cedro-cache:/cache"]
    steps:
      - name: Strumenti di base del contenitore (solo sul minipc)
        if: ${{ needs.scegli.outputs.locale == 'true' }}
        run: |
          rm -f /etc/apt/apt.conf.d/docker-clean
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' > /etc/apt/apt.conf.d/10-cedro-tieni
          mkdir -p /cache/apt-${{ github.job }}/partial && rm -rf /var/cache/apt/archives && ln -s /cache/apt-${{ github.job }} /var/cache/apt/archives
          apt-get update
          apt-get install -y --no-install-recommends sudo ca-certificates curl git build-essential python3 python-is-python3 xz-utils file util-linux

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Rust e cartelle che restano (solo sul minipc)
        if: ${{ needs.scegli.outputs.locale == 'true' }}
        run: tools/prepara-contenitore.sh target-motori

      - name: Librerie di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang libclang-dev pkg-config \
            libvulkan-dev glslc espeak-ng

      - uses: Swatinem/rust-cache@v2
        if: ${{ needs.scegli.outputs.locale != 'true' }}
        with:
          workspaces: trascrivi
          cache-targets: false

      - name: Motori base, avx2, avxvnni, avx512, avx512vnni, vulkan
        run: trascrivi/build.sh -o "$GITHUB_WORKSPACE/dist-motori" -t "${CEDRO_CACHE:-$RUNNER_TEMP}/ctv"

      - name: Prova di trascrizione (voce sintetica)
        run: |
          ls -l dist-motori
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' trascrivi/Cargo.toml | head -1)
          test -x "dist-motori/cedro-trascrivi-$version-linux-x64-vulkan"
          # La prova di Cedro vuole i motori col nome corto «cedro-trascrivi-<variante>».
          mkdir -p prova
          for f in dist-motori/cedro-trascrivi-*; do cp "$f" "prova/cedro-trascrivi-${f##*-linux-x64-}"; done
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libdbus-1-dev libasound2-dev
          CEDRO_TRASCRIVI_DIR="$PWD/prova" cargo test --release --lib transcribes_a_spoken_sentence -- --nocapture

      - uses: actions/upload-artifact@v4
        with:
          name: linux-motori
          path: dist-motori/cedro-trascrivi-*

      # Nel contenitore si lavora come root: i file lasciati nella cartella del runner tornano all'utente
      # del minipc, altrimenti il giro dopo non riesce a ripulirla.
      - name: Restituisce i file all'utente del minipc
        if: ${{ always() && needs.scegli.outputs.locale == 'true' }}
        run: chown -R 1000:1000 "$GITHUB_WORKSPACE" "$RUNNER_TEMP" || true

  riassunto:
    name: Motori del Riassunto AI (processore e Vulkan)
    needs: [scegli, invarianti]
    if: ${{ needs.invarianti.outputs.riuso != 'true' }}
    runs-on: ${{ needs.scegli.outputs.locale == 'true' && fromJSON('["self-hosted", "cedro-linux"]') || 'ubuntu-24.04' }}
    # Sul minipc: stesso sistema dei runner di GitHub (Ubuntu 24.04, quindi la stessa glibc minima per chi
    # installa), con un volume che tiene Rust, i pacchetti scaricati e le cartelle di compilazione.
    container:
      image: ${{ needs.scegli.outputs.locale == 'true' && 'ubuntu:24.04' || '' }}
      volumes: ["cedro-cache:/cache"]
    steps:
      - name: Strumenti di base del contenitore (solo sul minipc)
        if: ${{ needs.scegli.outputs.locale == 'true' }}
        run: |
          rm -f /etc/apt/apt.conf.d/docker-clean
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' > /etc/apt/apt.conf.d/10-cedro-tieni
          mkdir -p /cache/apt-${{ github.job }}/partial && rm -rf /var/cache/apt/archives && ln -s /cache/apt-${{ github.job }} /var/cache/apt/archives
          apt-get update
          apt-get install -y --no-install-recommends sudo ca-certificates curl git build-essential python3 python-is-python3 xz-utils file util-linux

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Rust e cartelle che restano (solo sul minipc)
        if: ${{ needs.scegli.outputs.locale == 'true' }}
        run: tools/prepara-contenitore.sh target-riassunto

      - name: Librerie di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang libclang-dev pkg-config libvulkan-dev glslc spirv-headers

      - uses: Swatinem/rust-cache@v2
        if: ${{ needs.scegli.outputs.locale != 'true' }}
        with:
          workspaces: riassumi
          cache-targets: false

      - name: Motori base, avx2, avxvnni, avx512, avx512vnni, vulkan
        run: riassumi/build.sh -o "$GITHUB_WORKSPACE/dist-riassumi" -t "${CEDRO_CACHE:-$RUNNER_TEMP}/crv"

      - name: Prove della logica del motore
        working-directory: riassumi
        run: CARGO_TARGET_DIR="${CEDRO_CACHE:-$RUNNER_TEMP}/crv/test" cargo test --release

      # Il modello vero (2,7 GB) resta in cache tra un giro e l'altro.
      - uses: actions/cache@v4
        if: ${{ needs.scegli.outputs.locale != 'true' }}
        with:
          path: ${{ runner.temp }}/qwen
          key: qwen3.5-4b-q4km-unsloth

      - name: Prova di riassunto (Qwen3.5-4B vero, sul processore del runner)
        run: |
          ls -l dist-riassumi
          model="${CEDRO_CACHE:-$RUNNER_TEMP}/qwen/Qwen3.5-4B-Q4_K_M.gguf"
          if [ ! -f "$model" ]; then
            mkdir -p "$(dirname "$model")"
            curl -fsSL --retry 5 -o "$model.part" https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf
            mv "$model.part" "$model"
          fi
          # AVX-512 può mancare sul runner, e la versione base è solo più lenta: si provano avx2 e vulkan (che qui ripiega sul processore).
          mkdir -p prova-riassumi
          cp dist-riassumi/cedro-riassumi-*-linux-x64-avx2 dist-riassumi/cedro-riassumi-*-linux-x64-vulkan prova-riassumi/
          riassumi/prova.sh prova-riassumi "$model"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-riassumi
          path: dist-riassumi/cedro-riassumi-*

      # Nel contenitore si lavora come root: i file lasciati nella cartella del runner tornano all'utente
      # del minipc, altrimenti il giro dopo non riesce a ripulirla.
      - name: Restituisce i file all'utente del minipc
        if: ${{ always() && needs.scegli.outputs.locale == 'true' }}
        run: chown -R 1000:1000 "$GITHUB_WORKSPACE" "$RUNNER_TEMP" || true

  pubblica:
    name: Aggiunge Linux alla release
    # I motori possono essere stati saltati (ripresi dalla release precedente): «skipped» va bene, «failure» no.
    if: ${{ always() && inputs.tag != '' && needs.app.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.motori.result) && contains(fromJSON('["success", "skipped"]'), needs.riassunto.result) }}
    needs: [app, motori, riassunto, invarianti]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: file
          merge-multiple: true

      - name: Motori della release precedente (sorgenti invariati)
        if: ${{ needs.invarianti.outputs.riuso == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREC: ${{ needs.invarianti.outputs.precedente }}
        run: |
          mkdir -p file
          gh release download "motori-$PREC" --pattern 'cedro-trascrivi-*-linux-x64-*' --pattern 'cedro-riassumi-*-linux-x64-*' --dir file
          # Controllo del SHA-256 contro quello registrato da GitHub al momento del caricamento.
          gh release view "motori-$PREC" --json assets --jq '.assets[] | select((.name | test("linux-x64-")) and .digest != null) | "\(.digest | sub("sha256:"; ""))  \(.name)"' > somme.txt
          (cd file && sha256sum -c ../somme.txt)
          # Il nome con la versione nuova lo mette il ciclo qui sotto.
      - name: Release ${{ inputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          find file -type f | sort
          version=${TAG#v}
          MOTORI="motori-$TAG"
          gh release view "$TAG" >/dev/null
          if ! gh release view "$MOTORI" >/dev/null 2>&1; then
            gh release create "$MOTORI" --target "$GITHUB_SHA" --prerelease --title "Motori di trascrizione $version (non servono: li scarica Cedro)" \
              --notes "Questi file non vanno scaricati a mano: Cedro li prende da qui la prima volta che trascrivi. Per installare Cedro vai su https://github.com/${GITHUB_REPOSITORY}/releases/latest"
          fi
          # Il nome dei motori deve avere la versione della release (Cedro cerca cedro-trascrivi-<versione>-...).
          for f in file/cedro-trascrivi-*-linux-x64-*; do
            new="file/cedro-trascrivi-$version-linux-x64-${f##*-linux-x64-}"
            [ "$f" = "$new" ] || mv "$f" "$new"
          done
          for f in file/cedro-riassumi-*-linux-x64-*; do
            new="file/cedro-riassumi-$version-linux-x64-${f##*-linux-x64-}"
            [ "$f" = "$new" ] || mv "$f" "$new"
          done
          gh release upload "$MOTORI" file/cedro-trascrivi-*-linux-x64-* file/cedro-riassumi-*-linux-x64-* --clobber
          gh release upload "$TAG" file/cedro-*-linux-x64.tar.gz --clobber
          # La riga per Linux nella tabella «Scarica questo», se manca.
          gh release view "$TAG" --json body --jq .body > note.md
          if ! grep -q 'linux-x64.tar.gz' note.md; then
            row="| **Linux** (Wayland con KDE Plasma o GNOME) | [**cedro-$version-linux-x64.tar.gz**](https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/cedro-$version-linux-x64.tar.gz) |"
            awk -v row="$row" '{print} /Cedro-ARM64-Setup-.*\.exe/ && !done {print row; done=1}' note.md > nuove.md
            grep -q 'linux-x64.tar.gz' nuove.md || { printf '%s\n\n' "$row" | cat - note.md > nuove.md; }
            sed -i 's/Linux è in pausa fino alla 0\.20\.\?//' nuove.md
            gh release edit "$TAG" --notes-file nuove.md
          fi
          for t in "$TAG" "$MOTORI"; do echo "== $t"; gh release view "$t" --json assets --jq '.assets[] | "\(.name)  \(.digest)"'; done
