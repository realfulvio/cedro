name: Prova contenitore (temporanea)
on:
  push:
    branches: ["claude/project-thread-nu31l4"]
    paths: [".github/workflows/prova-contenitore.yml"]
jobs:
  vuoto:
    runs-on: ubuntu-latest
    container:
      image: ${{ github.event_name == 'nessuno' && 'ubuntu:24.04' || '' }}
      volumes: ["cedro-cache:/cache"]
    steps:
      - run: cat /etc/os-release | head -2; ls -ld /cache || true; which sudo cargo
  pieno:
    runs-on: ubuntu-latest
    container:
      image: ${{ github.event_name == 'push' && 'ubuntu:24.04' || '' }}
      volumes: ["cedro-cache:/cache"]
    steps:
      - run: cat /etc/os-release | head -2; ls -ld /cache; echo HOME=$HOME; id
