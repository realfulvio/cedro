name: Prova runtime statico (temporanea)

# Prova veloce, solo per questa correzione (0.58.1): cedro.exe e una variante di ciascun motore, compilati con il
# runtime di Visual C++ dentro (+crt-static, /MT), e controllo che non importino vcruntime140/msvcp140.
# La prova completa (installatore, portable, tutte le varianti, avvio senza le DLL) è nel workflow «Windows ARM64».
# Si toglie prima dell'unione.
on:
  push:
    branches: ["claude/**"]
    paths: [".cargo/**", "trascrivi/build.ps1", "riassumi/build.ps1", "tools/dipendenze-pe.rs", ".github/workflows/prova-crt.yml"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  cedro:
    name: cedro.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
        shell: pwsh
      - shell: pwsh
        run: |
          rustc -O --edition 2021 -C target-feature=+crt-static tools\dipendenze-pe.rs -o dipendenze.exe
          .\dipendenze.exe target\release\cedro.exe
          if ($LASTEXITCODE -ne 0) { throw 'cedro.exe dipende dalle DLL di Visual C++' }

  trascrivi:
    name: motore di trascrizione (base)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          python -m pip install libclang
          if ($LASTEXITCODE -ne 0) { throw 'libclang non installato' }
          $env:LIBCLANG_PATH = python -c "import pathlib, clang; print(pathlib.Path(clang.__file__).parent / 'native')"
          powershell -File trascrivi\build.ps1 -Out motori -Solo base
          if ($LASTEXITCODE -ne 0) { throw 'compilazione fallita' }
          rustc -O --edition 2021 -C target-feature=+crt-static tools\dipendenze-pe.rs -o dipendenze.exe
          .\dipendenze.exe @(Get-ChildItem motori\*.exe | ForEach-Object FullName)
          if ($LASTEXITCODE -ne 0) { throw 'il motore dipende dalle DLL di Visual C++' }

  riassumi:
    name: motore del riassunto (base)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          python -m pip install libclang
          if ($LASTEXITCODE -ne 0) { throw 'libclang non installato' }
          $env:LIBCLANG_PATH = python -c "import pathlib, clang; print(pathlib.Path(clang.__file__).parent / 'native')"
          powershell -File riassumi\build.ps1 -Out motori -Solo base
          if ($LASTEXITCODE -ne 0) { throw 'compilazione fallita' }
          rustc -O --edition 2021 -C target-feature=+crt-static tools\dipendenze-pe.rs -o dipendenze.exe
          .\dipendenze.exe @(Get-ChildItem motori\*.exe | ForEach-Object FullName)
          if ($LASTEXITCODE -ne 0) { throw 'il motore dipende dalle DLL di Visual C++' }
