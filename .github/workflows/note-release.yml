name: Note della release

# Riscrive le note di una release già pubblicata con il testo di .github/note-release.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag della release (per esempio v0.22.0)"
        required: true

permissions:
  contents: write

jobs:
  note:
    name: Riscrive le note
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Note
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          sed "s/{versione}/${TAG#v}/g; s#{repo}#${GITHUB_REPOSITORY}#g" .github/note-release.md > note.md
          gh release edit "$TAG" --notes-file note.md
