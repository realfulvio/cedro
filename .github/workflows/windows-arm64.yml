name: Windows ARM64

# Compila e prova Cedro su un vero Windows on ARM (runner windows-11-arm) e anche su x64.
# Pubblicare: Actions → Windows ARM64 → Run workflow su main, con il tag (per esempio v0.18.0):
# crea la release (se non c'è) con gli installatori x64 e ARM64 e tutti i motori di trascrizione.
# Il job x64 (build, prove, installatore, motori) gira nella VM Windows del minipc di casa (runner con
# l'etichetta cedro-windows, cartelle di compilazione che restano) se è accesa e libera, altrimenti su GitHub;
# lo decide il job «scegli» con tools/sonda-runner.sh. Le prove che installano e disinstallano Cedro
# (x64-installa) girano sempre su un runner di GitHub, usa e getta.

on:
  push:
    branches: ["claude/**"]
    paths: ["Cargo.*", "src/**", "resources/**", "vendor/**", "trascrivi/**", "riassumi/**", "installer/**", "examples/**", "build.rs", ".github/workflows/windows-arm64.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag della release da pubblicare (vuoto = solo prova)"
        required: false
        default: ""
      solo_pulizia:
        description: "Non compila: toglie dalla release del tag (e dai suoi motori) i file di altre versioni"
        type: boolean
        default: false
      arm:
        description: "Anche Windows on ARM (messo da parte dall'11/11/2026: si riaccende solo quando lo chiede Luca)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  scegli:
    name: Sceglie dove compilare x64 (VM di casa o GitHub)
    if: ${{ !inputs.solo_pulizia }}
    runs-on: ubuntu-latest
    outputs:
      locale: ${{ steps.sonda.outputs.locale }}
    steps:
      - uses: actions/checkout@v4
      - id: sonda
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SONDA_REF: ${{ github.ref_name }}
        run: tools/sonda-runner.sh cedro-windows

  app:
    name: Cedro (build, prove, installatore)
    if: ${{ !inputs.solo_pulizia && inputs.arm }}
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        shell: pwsh
        run: |
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://win.rustup.rs/aarch64 -OutFile rustup-init.exe
            .\rustup-init.exe -y --default-toolchain stable --default-host aarch64-pc-windows-msvc
            "$env:USERPROFILE\.cargo\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }
          rustc -vV

      - name: LLVM (clang)
        shell: pwsh
        run: |
          Get-Command clang -ErrorAction SilentlyContinue | Format-List Source, Version
          Get-Command cmake, ninja -ErrorAction SilentlyContinue | Format-List Source

      - uses: Swatinem/rust-cache@v2

      - name: Prove adattatori web
        shell: pwsh
        run: python resources/web-adapters/test_adapters.py

      - name: Prove
        shell: pwsh
        run: cargo test --release

      - name: Che processore è (scheda Sistema)
        shell: pwsh
        run: cargo run --release --example sistema

      - name: Inno Setup
        shell: pwsh
        run: |
          # Provo più indirizzi finché il file scaricato è davvero un eseguibile (inizia con «MZ»).
          $urls = @('https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe')
          foreach ($u in $urls) {
            try {
              Invoke-WebRequest $u -OutFile is.exe -UserAgent 'Mozilla/5.0'
              $head = [System.IO.File]::ReadAllBytes("$PWD\is.exe")[0..1]
              "{0}: {1} byte, inizio {2}" -f $u, (Get-Item is.exe).Length, (([char[]]$head) -join '')
              $magic = ([char[]]$head) -join ''
              if ((Get-Item is.exe).Length -gt 1MB -and $magic -eq 'MZ') { break }
            } catch { "${u}: $_" }
          }
          $p = Start-Process .\is.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART' -Wait -PassThru
          "uscita dell'installatore: $($p.ExitCode)"
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe")) { throw 'Inno Setup non installato' }

      - name: Installatore ARM64 (e la copia per la vecchia edizione Comune di Bondeno)
        shell: pwsh
        run: powershell -File installer\build.ps1 -Arm64

      - uses: actions/upload-artifact@v4
        with:
          name: installatore-arm64
          path: |
            dist/Cedro-ARM64-Setup-*.exe
            dist/Cedro-Bondeno-ARM64-Setup-*.exe


  motori:
    name: Motore di trascrizione (processore)
    if: ${{ !inputs.solo_pulizia && inputs.arm }}
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        shell: pwsh
        run: |
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://win.rustup.rs/aarch64 -OutFile rustup-init.exe
            .\rustup-init.exe -y --default-toolchain stable --default-host aarch64-pc-windows-msvc
            "$env:USERPROFILE\.cargo\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }

      - name: LLVM (clang e libclang)
        shell: pwsh
        run: |
          $clang = Get-Command clang -ErrorAction SilentlyContinue
          if (-not $clang) {
            Invoke-WebRequest https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/LLVM-20.1.8-woa64.exe -OutFile llvm.exe
            Start-Process .\llvm.exe -ArgumentList '/S' -Wait
            $bin = "C:\Program Files\LLVM\bin"
          } else {
            $bin = Split-Path $clang.Source
          }
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "LIBCLANG_PATH=$bin" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Get-ChildItem $bin -Filter libclang.dll

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: trascrivi
          cache-targets: false

      - name: Motori base, dotprod, i8mm
        shell: pwsh
        run: powershell -File trascrivi\build.ps1 -SoloCpu -Out ${{ github.workspace }}\dist-motori

      - name: Prova di trascrizione (voce sintetica)
        shell: pwsh
        run: powershell -File trascrivi\prova.ps1 -Dir ${{ github.workspace }}\dist-motori

      - name: Motori del Riassunto AI base, dotprod, i8mm
        shell: pwsh
        run: powershell -File riassumi\build.ps1 -SoloCpu -Out ${{ github.workspace }}\dist-riassumi

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\qwen
          key: qwen3.5-4b-q4km-unsloth

      - name: Prova di riassunto (Qwen3.5-4B vero, motore dotprod)
        shell: pwsh
        run: |
          $model = "${{ runner.temp }}\qwen\Qwen3.5-4B-Q4_K_M.gguf"
          if (-not (Test-Path $model)) {
            New-Item -ItemType Directory -Force (Split-Path $model) | Out-Null
            curl.exe -fsSL --retry 5 -o "$model.part" https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf
            if ($LASTEXITCODE -ne 0) { throw 'modello non scaricato' }
            Move-Item "$model.part" $model
          }
          New-Item -ItemType Directory -Force prova-riassumi | Out-Null
          Get-ChildItem dist-riassumi -Filter *-dotprod.exe | Copy-Item -Destination prova-riassumi
          powershell -File riassumi\prova.ps1 -Dir prova-riassumi -Model $model
          if ($LASTEXITCODE -ne 0) { throw 'prova del riassunto fallita' }

      - uses: actions/upload-artifact@v4
        with:
          name: motori-arm64
          path: |
            dist-motori/*.exe
            dist-riassumi/*.exe


  vulkan:
    name: Motore di trascrizione (scheda video Vulkan, Adreno)
    if: ${{ !inputs.solo_pulizia && inputs.arm }}
    runs-on: windows-11-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        shell: pwsh
        run: |
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://win.rustup.rs/aarch64 -OutFile rustup-init.exe
            .\rustup-init.exe -y --default-toolchain stable --default-host aarch64-pc-windows-msvc
            "$env:USERPROFILE\.cargo\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }

      - name: LLVM (clang e libclang)
        shell: pwsh
        run: |
          $clang = Get-Command clang -ErrorAction SilentlyContinue
          if (-not $clang) {
            Invoke-WebRequest https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/LLVM-20.1.8-woa64.exe -OutFile llvm.exe
            Start-Process .\llvm.exe -ArgumentList '/S' -Wait
            $bin = "C:\Program Files\LLVM\bin"
          } else {
            $bin = Split-Path $clang.Source
          }
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "LIBCLANG_PATH=$bin" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Vulkan SDK per ARM64
        shell: pwsh
        run: |
          # Il server di LunarG a volte chiude la connessione: riprovo qualche volta.
          foreach ($i in 1..5) {
            try { Invoke-WebRequest https://sdk.lunarg.com/sdk/download/latest/warm/vulkan-sdk.exe -OutFile vulkan-sdk.exe; break }
            catch { "tentativo ${i}: $_"; if ($i -eq 5) { throw }; Start-Sleep -Seconds (10 * $i) }
          }
          Start-Process .\vulkan-sdk.exe -ArgumentList '--accept-licenses', '--default-answer', '--confirm-command', 'install' -Wait
          $sdk = (Get-ChildItem C:\VulkanSDK -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          "VULKAN_SDK=$sdk" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Get-ChildItem $sdk\Lib, $sdk\Bin | Select-Object -First 40 Name

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: trascrivi
          cache-targets: false

      - name: Motore Vulkan
        shell: pwsh
        run: powershell -File trascrivi\build.ps1 -SoloVulkan -Out ${{ github.workspace }}\dist-motori

      - name: "Prova di trascrizione (senza scheda video, ripiega sul processore)"
        shell: pwsh
        run: powershell -File trascrivi\prova.ps1 -Dir ${{ github.workspace }}\dist-motori

      - name: Motore del Riassunto AI Vulkan
        shell: pwsh
        run: powershell -File riassumi\build.ps1 -SoloVulkan -Out ${{ github.workspace }}\dist-riassumi

      - uses: actions/upload-artifact@v4
        with:
          name: motore-vulkan-arm64
          path: |
            dist-motori/*.exe
            dist-riassumi/*.exe

  x64:
    name: Cedro x64 (prove, installatore, motori)
    if: ${{ !inputs.solo_pulizia }}
    needs: scegli
    runs-on: ${{ needs.scegli.outputs.locale == 'true' && fromJSON('["self-hosted", "cedro-windows"]') || 'windows-latest' }}
    steps:
      # Sulla VM di casa la cartella target resta tra un giro e l'altro (si toglie tutto il resto).
      - uses: actions/checkout@v4
        with:
          clean: ${{ needs.scegli.outputs.locale != 'true' }}

      - name: Ripulisce la copia di lavoro tenendo target (solo sulla VM di casa)
        if: ${{ needs.scegli.outputs.locale == 'true' }}
        shell: pwsh
        run: |
          git clean -ffdx -e /target
          git reset --hard HEAD

      - uses: Swatinem/rust-cache@v2
        if: ${{ needs.scegli.outputs.locale != 'true' }}

      - name: Prove adattatori web
        shell: pwsh
        run: python resources/web-adapters/test_adapters.py

      - name: Prove
        shell: pwsh
        run: cargo test --release

      - name: "Prova su siti veri (Video dal web: Vimeo, Internet Archive)"
        shell: pwsh
        continue-on-error: true
        run: cargo test --release --lib real_sites -- --ignored --nocapture

      - name: Inno Setup
        shell: pwsh
        run: |
          # Gli stessi posti in cui lo cerca installer\build.ps1. Sulla VM di casa il runner è un servizio di sistema:
          # lì si installa per tutti gli utenti (in Programmi), perché «solo per me» finirebbe nel profilo di sistema.
          $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe", "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          if ($iscc | Where-Object { Test-Path $_ }) { 'Inno Setup già installato'; exit 0 }
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe -OutFile is.exe
          $scope = if ('${{ needs.scegli.outputs.locale }}' -eq 'true') { '/ALLUSERS' } else { '/CURRENTUSER' }
          $p = Start-Process .\is.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', $scope, '/NORESTART' -Wait -PassThru
          if (-not ($iscc | Where-Object { Test-Path $_ })) { throw "Inno Setup non installato ($($p.ExitCode))" }

      - name: Installatore x64 (e la copia per la vecchia edizione Comune di Bondeno)
        shell: pwsh
        run: powershell -File installer\build.ps1

      - name: Versione portable (zip)
        shell: pwsh
        run: powershell -File installer\portable.ps1

      - name: "Prova della versione portable: parte senza installare e tiene i dati accanto all'exe"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          Expand-Archive "dist\Cedro-Portable-$v-x64.zip" -DestinationPath portable
          $dir = Resolve-Path 'portable\Cedro-Portable'
          foreach ($f in 'cedro.exe', 'cedro.portable', 'LICENSE', 'Licenze di terze parti.txt') { if (-not (Test-Path (Join-Path $dir $f))) { throw "manca $f nello zip" } }
          # Con un APPDATA vuoto e a parte: se Cedro scrive lì, la prova fallisce.
          $env:APPDATA = Join-Path $PWD 'appdata-finto'; $env:LOCALAPPDATA = Join-Path $PWD 'localappdata-finto'
          New-Item -ItemType Directory -Force $env:APPDATA, $env:LOCALAPPDATA | Out-Null
          & (Join-Path $dir 'cedro.exe') --quality 80 convert tests\fixtures\scan.jpg png 2>&1 | Out-Host
          if (Get-ChildItem $env:APPDATA, $env:LOCALAPPDATA -Recurse -Force) { throw 'la versione portable ha scritto fuori dalla sua cartella' }

      - name: Compila i motori x64 dai sorgenti correnti
        shell: pwsh
        run: |
          python -m pip install libclang
          if ($LASTEXITCODE -ne 0) { throw 'libclang non installato' }
          $env:LIBCLANG_PATH = python -c "import pathlib, clang; print(pathlib.Path(clang.__file__).parent / 'native')"
          $sdk = Get-ChildItem C:\VulkanSDK -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) {
            foreach ($i in 1..5) {
              try { Invoke-WebRequest https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe -OutFile vulkan-sdk.exe; break }
              catch { if ($i -eq 5) { throw }; Start-Sleep -Seconds (10 * $i) }
            }
            Start-Process .\vulkan-sdk.exe -ArgumentList '--accept-licenses', '--default-answer', '--confirm-command', 'install' -Wait
            $sdk = Get-ChildItem C:\VulkanSDK -Directory | Sort-Object Name -Descending | Select-Object -First 1
          }
          if (-not $sdk) { throw 'Vulkan SDK x64 non trovato' }
          $env:VULKAN_SDK = $sdk.FullName
          powershell -File trascrivi\build.ps1 -Out "${{ github.workspace }}\motori-x64" -Target C:\ctv
          if ($LASTEXITCODE -ne 0) { throw 'compilazione motori x64 fallita' }
          powershell -File riassumi\build.ps1 -Out "${{ github.workspace }}\motori-x64" -Target C:\crv
          if ($LASTEXITCODE -ne 0) { throw 'compilazione motori del riassunto x64 fallita' }

      - name: Prova motori x64 compatibili con il runner
        shell: pwsh
        run: |
          # Non eseguire AVX-512/VNNI su runner che possono non avere quelle istruzioni.
          New-Item -ItemType Directory -Force motori-prova | Out-Null
          Get-ChildItem motori-x64 -Filter *.exe | Where-Object Name -Match '-(base|avx2|vulkan)\.exe$' | Copy-Item -Destination motori-prova
          powershell -File trascrivi\prova.ps1 -Dir "${{ github.workspace }}\motori-prova"
          if ($LASTEXITCODE -ne 0) { throw 'prova motori x64 fallita' }

      - uses: actions/cache@v4
        if: ${{ needs.scegli.outputs.locale != 'true' }}
        with:
          path: ${{ runner.temp }}\qwen
          key: qwen3.5-4b-q4km-unsloth

      - name: Prova del Riassunto AI (Qwen3.5-4B vero, motori avx2 e vulkan)
        shell: pwsh
        env:
          QWEN_DIR: ${{ needs.scegli.outputs.locale == 'true' && 'C:\cedro-cache\qwen' || format('{0}\qwen', runner.temp) }}
        run: |
          $model = "$env:QWEN_DIR\Qwen3.5-4B-Q4_K_M.gguf"
          if (-not (Test-Path $model)) {
            New-Item -ItemType Directory -Force (Split-Path $model) | Out-Null
            curl.exe -fsSL --retry 5 -o "$model.part" https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf
            if ($LASTEXITCODE -ne 0) { throw 'modello non scaricato' }
            Move-Item "$model.part" $model
          }
          New-Item -ItemType Directory -Force prova-riassumi | Out-Null
          Get-ChildItem motori-x64 -Filter cedro-riassumi-*.exe | Where-Object Name -Match '-(avx2|vulkan)\.exe$' | Copy-Item -Destination prova-riassumi
          powershell -File riassumi\prova.ps1 -Dir prova-riassumi -Model $model
          if ($LASTEXITCODE -ne 0) { throw 'prova del riassunto x64 fallita' }

      - uses: actions/upload-artifact@v4
        with:
          name: x64
          path: |
            dist/Cedro-Setup-*.exe
            dist/Cedro-Bondeno-Setup-*.exe
            dist/Cedro-Portable-*-x64.zip
            motori-x64/*.exe

  x64-installa:
    name: Cedro x64 (installa, aggiorna e disinstalla davvero)
    if: ${{ !inputs.solo_pulizia }}
    needs: x64
    # Sempre su GitHub: queste prove installano, aggiornano e tolgono Cedro dal sistema (anche per tutti gli
    # utenti, in Programmi): su un PC che resta non si fanno.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: x64

      - name: "Aggiornamento vero: una 0.17 installata prende e installa l'installatore x64 nuovo"
        # Fino alla 0.17 Cedro prende il primo file «Cedro-Setup….exe» della release (GitHub li elenca in ordine
        # alfabetico): qui si rifà la stessa scelta sui nomi della release nuova e si installa sopra la 0.17.1.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{5C1CAEBF-024C-4A9F-BEC8-1FB3C9FEA4CE}_is1'
          gh release download v0.17.1 --pattern 'Cedro-Setup-*.exe' --dir vecchio
          Start-Process (Get-Item vecchio\Cedro-Setup-*.exe).FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART' -Wait
          "Installata: $((Get-ItemProperty $key).DisplayVersion)"
          if ((Get-ItemProperty $key).DisplayVersion -ne '0.17.1') { throw '0.17.1 non installata' }
          [string[]]$names = @("Cedro-ARM64-Setup-$version.exe", "Cedro-Bondeno-ARM64-Setup-$version.exe", "Cedro-Bondeno-Setup-$version.exe", "Cedro-Setup-$version.exe", "cedro-$version-linux-x64.tar.gz", "cedro-bondeno-$version-linux-x64.tar.gz")
          [Array]::Sort($names, [StringComparer]::Ordinal)
          $picked = $names | Where-Object { $_.StartsWith('Cedro-Setup') -and $_.EndsWith('.exe') } | Select-Object -First 1
          "La 0.17 sceglie: $picked"
          if ($picked -ne "Cedro-Setup-$version.exe") { throw "la 0.17 sceglierebbe $picked" }
          Start-Process (Get-Item "dist\$picked").FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART' -Wait
          Get-Process cedro -ErrorAction SilentlyContinue | Stop-Process -Force
          "Dopo l'aggiornamento: $((Get-ItemProperty $key).DisplayVersion)"
          if ((Get-ItemProperty $key).DisplayVersion -ne $version) { throw "aggiornamento a $version non riuscito" }

      - name: "Aggiornamento vero: la vecchia edizione Bondeno prende la copia Cedro-Bondeno-Setup e lascia il file da-bondeno"
        # La 0.20.x Bondeno cerca «Cedro-Bondeno-Setup-<v>.exe»: la copia è lo stesso installatore, che dal nome
        # capisce di dover lasciare il file con cui Cedro accende da solo il tema Bondeno.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{5C1CAEBF-024C-4A9F-BEC8-1FB3C9FEA4CE}_is1'
          $marker = Join-Path $env:APPDATA 'Cedro\da-bondeno'
          gh release download v0.20.1 --pattern 'Cedro-Bondeno-Setup-*.exe' --dir bondeno
          Start-Process (Get-Item bondeno\Cedro-Bondeno-Setup-*.exe).FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART' -Wait
          Get-Process cedro -ErrorAction SilentlyContinue | Stop-Process -Force
          if ((Get-ItemProperty $key).DisplayVersion -ne '0.20.1') { throw '0.20.1 Bondeno non installata' }
          Remove-Item $marker -ErrorAction SilentlyContinue
          # Come fa la vecchia edizione: solo i nomi che conosce.
          $copia = Get-Item "dist\Cedro-Bondeno-Setup-$version.exe"
          if ((Get-FileHash $copia).Hash -ne (Get-FileHash "dist\Cedro-Setup-$version.exe").Hash) { throw 'la copia non è identica' }
          Start-Process $copia.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART' -Wait
          Get-Process cedro -ErrorAction SilentlyContinue | Stop-Process -Force
          if ((Get-ItemProperty $key).DisplayVersion -ne $version) { throw "aggiornamento a $version non riuscito" }
          if (-not (Test-Path $marker)) { throw 'manca il file da-bondeno: il tema Bondeno non si accenderebbe' }
          "Il file da-bondeno c'è."
          Remove-Item $marker

      - name: "Una sola copia: per tutti gli utenti, per l'utente, aggiornamenti e disinstallazione"
        # Le copie doppie nascevano dalla scelta «per tutti / solo per me»: qui una Cedro in Programmi si aggiorna
        # lì (mai una seconda per l'utente), un'installazione per tutti toglie quella per l'utente, gli aggiornamenti
        # silenziosi non riaccendono l'avvio con Windows né il collegamento cancellato, la disinstallazione pulisce.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $sub = 'Software\Microsoft\Windows\CurrentVersion\Uninstall\{5C1CAEBF-024C-4A9F-BEC8-1FB3C9FEA4CE}_is1'
          $user = "HKCU:\$sub"; $all = "HKLM:\$sub"
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $setup = (Get-Item "dist\Cedro-Setup-$version.exe").FullName
          $silent = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/SILENTUPDATE'
          $pf = Join-Path $env:ProgramFiles 'Cedro\cedro.exe'
          $mine = Join-Path $env:LOCALAPPDATA 'Programs\Cedro\cedro.exe'
          $common = Join-Path $env:PUBLIC 'Desktop\Cedro.lnk'
          # Start-Process -Wait aspetterebbe anche Cedro, che l'aggiornamento riapre e resta nella tray.
          $n = 0
          function Invoke-Setup($exe, [string[]]$params) {
            $script:n++
            $log = Join-Path $env:RUNNER_TEMP "setup-$script:n.log"
            "   > $(Split-Path $exe -Leaf) $($params -join ' ')"
            $p = Start-Process $exe -ArgumentList ($params + "/LOG=$log") -PassThru
            if (-not $p.WaitForExit(240000)) {
              Get-Process | Where-Object { $_.ProcessName -match 'setup|unins|_iu|cedro|cmd' } | Format-Table Id, ProcessName, StartTime | Out-String
              Get-ChildItem $env:RUNNER_TEMP -Filter 'setup-*.log' | ForEach-Object { "--- $($_.Name)"; Get-Content $_.FullName -Tail 40 }
              throw "$exe non finisce"
            }
          }
          # Il disinstallatore si copia in %TEMP% (_iu…) e lavora da lì: si aspetta anche quella copia.
          function Wait-Uninstall { for ($i = 0; $i -lt 60; $i++) { if (-not (Get-Process | Where-Object { $_.ProcessName -match '^(_iu|unins)' })) { return }; Start-Sleep 2 } }
          function Stop-Cedro { Start-Sleep 2; Get-Process cedro -ErrorAction SilentlyContinue | Stop-Process -Force }
          function Wait-Version($key, $v) {
            for ($i = 0; $i -lt 90; $i++) {
              if ((Get-ItemProperty $key -ErrorAction SilentlyContinue).DisplayVersion -eq $v -and -not (Get-Process 'Cedro-*Setup*' -ErrorAction SilentlyContinue)) { return }
              Start-Sleep 2
            }
            throw "$key non arriva alla $v"
          }
          # Da zero: via la copia per l'utente lasciata dai passi prima.
          $u = (Get-ItemProperty $user -ErrorAction SilentlyContinue).UninstallString
          if ($u) { Invoke-Setup ($u.Trim('"')) @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'); Start-Sleep 2; Wait-Uninstall }
          if (Test-Path $user) { throw 'la copia per l''utente non va via' }

          "1) Una 0.35.4 per tutti gli utenti (la scelta della procedura vecchia) si aggiorna in Programmi"
          gh release download v0.35.4 --pattern 'Cedro-Setup-*.exe' --dir permacchina
          Invoke-Setup (Get-Item permacchina\Cedro-Setup-*.exe).FullName @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/ALLUSERS', '/TASKS=desktopicon')
          Stop-Cedro
          if ((Get-ItemProperty $all).DisplayVersion -ne '0.35.4') { throw '0.35.4 per tutti non installata' }
          Invoke-Setup $setup @($silent)
          Wait-Version $all $version
          Stop-Cedro
          if (Test-Path $user) { throw 'COPIA DOPPIA: l''aggiornamento ha installato Cedro anche per l''utente' }
          if (Test-Path $mine) { throw "COPIA DOPPIA in $mine" }
          if ((Get-Item $pf).VersionInfo.ProductVersion -eq $null) { throw "manca $pf" }
          "   ok: $((Get-ItemProperty $all).DisplayVersion) in Programmi, nessuna copia per l'utente"

          "2) Gli aggiornamenti silenziosi non riaccendono l'avvio con Windows e non rimettono il collegamento cancellato"
          Remove-ItemProperty $run -Name Cedro -ErrorAction SilentlyContinue
          Remove-Item $common -ErrorAction SilentlyContinue
          Invoke-Setup $setup @($silent)
          Wait-Version $all $version
          Stop-Cedro
          if ((Get-ItemProperty $run -ErrorAction SilentlyContinue).Cedro) { throw 'l''aggiornamento ha riacceso l''avvio con Windows' }
          if (Test-Path $common) { throw 'l''aggiornamento ha rimesso il collegamento sul desktop' }
          "   ok"

          "3) Installando per tutti gli utenti, la copia per l'utente va via (e l'avvio con Windows passa alla nuova)"
          $u = (Get-ItemProperty $all).UninstallString.Trim('"')
          Invoke-Setup $u @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'); Start-Sleep 2; Wait-Uninstall
          Invoke-Setup $setup @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER')
          Stop-Cedro
          if (-not (Test-Path $mine)) { throw "manca $mine" }
          if ((Get-ItemProperty $run).Cedro -ne "`"$mine`"") { throw "avvio con Windows: $((Get-ItemProperty $run).Cedro)" }
          Invoke-Setup $setup @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/ALLUSERS')
          Stop-Cedro
          if (Test-Path $user) { throw 'COPIA DOPPIA: resta la voce per l''utente' }
          if (Test-Path $mine) { throw "COPIA DOPPIA: resta $mine" }
          if ((Get-ItemProperty $all).DisplayVersion -ne $version) { throw 'manca la copia per tutti' }
          if ((Get-ItemProperty $run).Cedro -ne "`"$pf`"") { throw "avvio con Windows: $((Get-ItemProperty $run).Cedro)" }
          "   ok"

          "4) Disinstallazione: niente cartella, voce, collegamenti, avvio con Windows"
          New-Item -ItemType Directory -Force (Join-Path $env:LOCALAPPDATA 'Cedro\trascrizione') | Out-Null
          $u = (Get-ItemProperty $all).UninstallString.Trim('"')
          Invoke-Setup $u @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'); Start-Sleep 2; Wait-Uninstall
          if (Test-Path $all) { throw 'resta la voce in Programmi' }
          # Il disinstallatore toglie la propria cartella per ultima, qualche istante dopo essere uscito.
          for ($i = 0; $i -lt 30 -and (Test-Path (Split-Path $pf)); $i++) { Start-Sleep 1 }
          if (Test-Path (Split-Path $pf)) {
            $left = Get-ChildItem -Recurse -Force (Split-Path $pf)
            if ($left) { throw "resta $(Split-Path $pf): $($left.FullName -join ', ')" }
            # Una cartella vuota la può tenere un altro processo (antivirus, indicizzazione): Windows la toglie dopo.
            "   (resta la cartella vuota $(Split-Path $pf), tenuta aperta da un altro processo)"
          }
          if ((Get-ItemProperty $run -ErrorAction SilentlyContinue).Cedro) { throw 'resta l''avvio con Windows' }
          $links = Get-ChildItem "$env:ProgramData\Microsoft\Windows\Start Menu", "$env:APPDATA\Microsoft\Windows\Start Menu", "$env:PUBLIC\Desktop", ([Environment]::GetFolderPath('Desktop')) -Recurse -Filter 'Cedro*.lnk' -ErrorAction SilentlyContinue
          if ($links) { throw "restano collegamenti: $($links.FullName -join ', ')" }
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'Cedro\trascrizione'))) { throw 'la disinstallazione silenziosa ha cancellato i modelli' }
          "   ok"

  pubblica:
    name: Pubblica la release
    if: ${{ always() && inputs.tag != '' && (!inputs.arm || (needs.app.result == 'success' && needs.motori.result == 'success')) && needs.x64.result == 'success' && needs.x64-installa.result == 'success' }}
    needs: [app, motori, vulkan, x64, x64-installa]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: file
          merge-multiple: true

      # La release della versione ha solo i pacchetti da scaricare; i motori di trascrizione vanno in una
      # pre-release a parte («motori-v<versione>»), che Cedro legge da solo e che non diventa mai «latest».
      - name: Release ${{ inputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ARM: ${{ inputs.arm }}
        run: |
          find file -type f | sort
          V="${TAG#v}"
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$CARGO" != "$V" ]; then echo "Il tag $TAG non corrisponde alla versione $CARGO di Cargo.toml"; exit 1; fi
          if find file -type f \( -name '*.exe' -o -name '*.zip' \) | grep -v -- "$V" | grep .; then echo "File di un'altra versione"; exit 1; fi
          MOTORI="motori-$TAG"
          if ! gh release view "$MOTORI" >/dev/null 2>&1; then
            gh release create "$MOTORI" --target "$GITHUB_SHA" --prerelease --title "Motori di trascrizione ${TAG#v} (non servono: li scarica Cedro)" \
              --notes "Questi file non vanno scaricati a mano: Cedro li prende da qui la prima volta che trascrivi. Per installare Cedro vai su https://github.com/${GITHUB_REPOSITORY}/releases/latest"
          fi
          gh release upload "$MOTORI" $(find file -type f \( -name 'cedro-trascrivi-*' -o -name 'cedro-riassumi-*' \)) --clobber
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            sed "s/{versione}/${TAG#v}/g; s#{repo}#${GITHUB_REPOSITORY}#g" .github/note-release.md > note.md
            # Senza ARM: via la riga dell'installatore ARM e il consiglio su quale scegliere.
            [ "$ARM" = true ] || sed -i '/ARM64-Setup-/d; /basato su ARM/d' note.md
            # Una bozza non crea il tag, e il workflow «Linux» fa il checkout del tag: lo creo prima.
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "$TAG" >/dev/null
            # In bozza: nessun Cedro la vede finché non ci sono i pacchetti di tutti i sistemi (job «apri»).
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --title "Cedro ${TAG#v}" --notes-file note.md
          fi
          gh release upload "$TAG" $(find file -type f \( -name 'Cedro-*Setup-*.exe' -o -name 'Cedro-Portable-*-x64.zip' \)) --clobber
          for t in "$TAG" "$MOTORI"; do echo "== $t"; gh release view "$t" --json assets --jq '.assets[] | "\(.name)  \(.digest)"'; done

      - name: Linux (tar.gz e motori) con il workflow «Linux»
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh workflow run linux.yml --ref "$GITHUB_REF_NAME" -f tag="$TAG"

  # Le versioni già installate non distinguono «manca ancora il mio pacchetto» da «non c'è»: la release
  # diventa pubblica (e «latest») solo quando ha i sei pacchetti, compresi i tar.gz del workflow «Linux».
  apri:
    name: Pubblica la release quando ci sono tutti i pacchetti
    needs: pubblica
    # always(): con ARM spento i job ARM risultano «saltati», e senza questo anche apri e verifica verrebbero
    # saltati (la 0.40.0 è rimasta in bozza così).
    if: ${{ always() && needs.pubblica.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          ARM: ${{ inputs.arm }}
        run: |
          V="${TAG#v}"
          want="Cedro-Setup-$V.exe Cedro-Bondeno-Setup-$V.exe Cedro-Portable-$V-x64.zip cedro-$V-linux-x64.tar.gz cedro-bondeno-$V-linux-x64.tar.gz"
          [ "$ARM" = true ] && want="$want Cedro-ARM64-Setup-$V.exe Cedro-Bondeno-ARM64-Setup-$V.exe"
          for i in $(seq 1 90); do
            have=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            missing=""
            for f in $want; do grep -qxF "$f" <<<"$have" || missing="$missing $f"; done
            [ -z "$missing" ] && break
            echo "Mancano ancora:$missing"
            sleep 60
          done
          if [ -n "$missing" ]; then echo "La release resta in bozza: mancano$missing"; exit 1; fi
          gh release edit "$TAG" --draft=false --latest
          gh release view "$TAG" --json isDraft,assets --jq '"bozza: \(.isDraft)", (.assets[].name)'

  verifica:
    name: "Dopo la pubblicazione: una 0.17 vera si aggiorna da GitHub, la nuova trascrive"
    needs: apri
    if: ${{ always() && needs.apri.result == 'success' }}
    runs-on: windows-latest
    steps:
      - name: Controlla aggiornamenti dalla 0.17.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{5C1CAEBF-024C-4A9F-BEC8-1FB3C9FEA4CE}_is1'
          gh release download v0.17.1 --repo $env:GITHUB_REPOSITORY --pattern 'Cedro-Setup-*.exe' --dir vecchio
          Start-Process (Get-Item vecchio\Cedro-Setup-*.exe).FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART' -Wait
          Get-Process cedro -ErrorAction SilentlyContinue | Stop-Process -Force
          $exe = Join-Path (Get-ItemProperty $key).InstallLocation 'cedro.exe'
          # «cedro update» della 0.17 vera: chiede conferma, scarica l'installatore scelto, controlla lo SHA-256 e lo avvia.
          $psi = New-Object Diagnostics.ProcessStartInfo $exe, 'update'
          $psi.UseShellExecute = $false
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $p = [Diagnostics.Process]::Start($psi)
          # Letture asincrone: l'installatore avviato da Cedro eredita stdout e lo tiene aperto finché non si chiude.
          $stdout = $p.StandardOutput.ReadToEndAsync()
          $stderr = $p.StandardError.ReadToEndAsync()
          $p.StandardInput.WriteLine('s'); $p.StandardInput.Close()
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw 'cedro update non finisce' }
          Start-Sleep -Seconds 3
          Get-Process | Where-Object { $_.ProcessName -like 'Cedro-*Setup*' } | ForEach-Object { Write-Host "Installatore avviato: $($_.ProcessName)"; $_ } | Stop-Process -Force
          $null = $stdout.Wait(30000); $null = $stderr.Wait(30000)
          $out = $stdout.Result + $stderr.Result
          $out
          if ($out -notmatch [regex]::Escape("Avviato Cedro-Setup-$version.exe")) { throw "la 0.17 non ha preso Cedro-Setup-$version.exe" }

      - name: La nuova trascrive con il motore della release dei motori
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{5C1CAEBF-024C-4A9F-BEC8-1FB3C9FEA4CE}_is1'
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern 'Cedro-Setup-*.exe' --dir nuovo
          Start-Process (Get-Item nuovo\Cedro-Setup-*.exe).FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART' -Wait
          Get-Process cedro -ErrorAction SilentlyContinue | Stop-Process -Force
          "Installata: $((Get-ItemProperty $key).DisplayVersion)"
          $exe = Join-Path (Get-ItemProperty $key).InstallLocation 'cedro.exe'
          $wav = Join-Path $env:RUNNER_TEMP 'frase.wav'
          powershell -Command "Add-Type -AssemblyName System.Speech; `$v = New-Object System.Speech.Synthesis.SpeechSynthesizer; `$v.SetOutputToWaveFile('$wav'); `$v.Speak('Good morning. The weather today is sunny and warm.'); `$v.Dispose()"
          $psi = New-Object Diagnostics.ProcessStartInfo $exe, "trascrivi `"$wav`" --testo --precisione veloce"
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $p = [Diagnostics.Process]::Start($psi)
          $err = $p.StandardError.ReadToEndAsync()
          $out = $p.StandardOutput.ReadToEndAsync()
          if (-not $p.WaitForExit(600000)) { $p.Kill(); throw 'la trascrizione non finisce' }
          $out.Result; $err.Result
          $txt = Get-ChildItem $env:RUNNER_TEMP -Recurse -Filter 'frase*.txt' | Select-Object -First 1
          if (-not $txt) { throw 'nessun testo' }
          Get-Content $txt.FullName
          if ((Get-Content $txt.FullName -Raw) -notmatch 'weather') { throw 'trascrizione sbagliata' }

  pulizia:
    name: Toglie i file di altre versioni dalla release
    if: ${{ inputs.solo_pulizia && inputs.tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          V="${TAG#v}"
          for t in "$TAG" "motori-$TAG"; do
            gh api "repos/$REPO/releases/tags/$t" --jq '.assets[] | "\(.id) \(.name)"' | while read -r id name; do
              case "$name" in
                *"$V"*) echo "tengo $t/$name" ;;
                *) echo "tolgo $t/$name"; gh api -X DELETE "repos/$REPO/releases/assets/$id" ;;
              esac
            done
          done
