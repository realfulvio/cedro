name: Windows ARM64

# Compila e prova Cedro su un vero Windows on ARM (runner windows-11-arm) e anche su x64.
# Pubblicare: Actions → Windows ARM64 → Run workflow su main, con il tag (per esempio v0.18.0):
# crea la release (se non c'è) con gli installatori x64 e ARM64 e tutti i motori di trascrizione.

on:
  push:
    branches: ["claude/**"]
    paths: ["Cargo.*", "src/**", "vendor/**", "trascrivi/**", "installer/**", "examples/**", "build.rs", ".github/workflows/windows-arm64.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag della release da pubblicare (vuoto = solo prova)"
        required: false
        default: ""
      solo_pulizia:
        description: "Non compila: toglie dalla release del tag (e dai suoi motori) i file di altre versioni"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: Cedro (build, prove, installatore)
    if: ${{ !inputs.solo_pulizia }}
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        shell: pwsh
        run: |
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://win.rustup.rs/aarch64 -OutFile rustup-init.exe
            .\rustup-init.exe -y --default-toolchain stable --default-host aarch64-pc-windows-msvc
            "$env:USERPROFILE\.cargo\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }
          rustc -vV

      - name: LLVM (clang)
        shell: pwsh
        run: |
          Get-Command clang -ErrorAction SilentlyContinue | Format-List Source, Version
          Get-Command cmake, ninja -ErrorAction SilentlyContinue | Format-List Source

      - uses: Swatinem/rust-cache@v2

      - name: Prove
        shell: pwsh
        run: cargo test --release

      - name: Che processore è (scheda Sistema)
        shell: pwsh
        run: cargo run --release --example sistema

      - name: Inno Setup
        shell: pwsh
        run: |
          # Provo più indirizzi finché il file scaricato è davvero un eseguibile (inizia con «MZ»).
          $urls = @('https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe')
          foreach ($u in $urls) {
            try {
              Invoke-WebRequest $u -OutFile is.exe -UserAgent 'Mozilla/5.0'
              $head = [System.IO.File]::ReadAllBytes("$PWD\is.exe")[0..1]
              "{0}: {1} byte, inizio {2}" -f $u, (Get-Item is.exe).Length, (([char[]]$head) -join '')
              $magic = ([char[]]$head) -join ''
              if ((Get-Item is.exe).Length -gt 1MB -and $magic -eq 'MZ') { break }
            } catch { "${u}: $_" }
          }
          $p = Start-Process .\is.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART' -Wait -PassThru
          "uscita dell'installatore: $($p.ExitCode)"
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe")) { throw 'Inno Setup non installato' }

      - name: Installatore ARM64
        shell: pwsh
        run: powershell -File installer\build.ps1 -Arm64

      - name: Installatore ARM64, edizione Comune di Bondeno
        shell: pwsh
        run: powershell -File installer\build.ps1 -Arm64 -Bondeno

      - uses: actions/upload-artifact@v4
        with:
          name: installatore-arm64
          path: |
            dist/Cedro-ARM64-Setup-*.exe
            dist/Cedro-Bondeno-ARM64-Setup-*.exe


  motori:
    name: Motore di trascrizione (processore)
    if: ${{ !inputs.solo_pulizia }}
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        shell: pwsh
        run: |
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://win.rustup.rs/aarch64 -OutFile rustup-init.exe
            .\rustup-init.exe -y --default-toolchain stable --default-host aarch64-pc-windows-msvc
            "$env:USERPROFILE\.cargo\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }

      - name: LLVM (clang e libclang)
        shell: pwsh
        run: |
          $clang = Get-Command clang -ErrorAction SilentlyContinue
          if (-not $clang) {
            Invoke-WebRequest https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/LLVM-20.1.8-woa64.exe -OutFile llvm.exe
            Start-Process .\llvm.exe -ArgumentList '/S' -Wait
            $bin = "C:\Program Files\LLVM\bin"
          } else {
            $bin = Split-Path $clang.Source
          }
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "LIBCLANG_PATH=$bin" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Get-ChildItem $bin -Filter libclang.dll

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: trascrivi
          cache-targets: false

      - name: Motori base, dotprod, i8mm
        shell: pwsh
        run: powershell -File trascrivi\build.ps1 -SoloCpu -Out ${{ github.workspace }}\dist-motori

      - name: Prova di trascrizione (voce sintetica)
        shell: pwsh
        run: powershell -File trascrivi\prova.ps1 -Dir ${{ github.workspace }}\dist-motori

      - uses: actions/upload-artifact@v4
        with:
          name: motori-arm64
          path: dist-motori/*.exe


  vulkan:
    name: Motore di trascrizione (scheda video Vulkan, Adreno)
    if: ${{ !inputs.solo_pulizia }}
    runs-on: windows-11-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        shell: pwsh
        run: |
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://win.rustup.rs/aarch64 -OutFile rustup-init.exe
            .\rustup-init.exe -y --default-toolchain stable --default-host aarch64-pc-windows-msvc
            "$env:USERPROFILE\.cargo\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }

      - name: LLVM (clang e libclang)
        shell: pwsh
        run: |
          $clang = Get-Command clang -ErrorAction SilentlyContinue
          if (-not $clang) {
            Invoke-WebRequest https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/LLVM-20.1.8-woa64.exe -OutFile llvm.exe
            Start-Process .\llvm.exe -ArgumentList '/S' -Wait
            $bin = "C:\Program Files\LLVM\bin"
          } else {
            $bin = Split-Path $clang.Source
          }
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "LIBCLANG_PATH=$bin" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Vulkan SDK per ARM64
        shell: pwsh
        run: |
          # Il server di LunarG a volte chiude la connessione: riprovo qualche volta.
          foreach ($i in 1..5) {
            try { Invoke-WebRequest https://sdk.lunarg.com/sdk/download/latest/warm/vulkan-sdk.exe -OutFile vulkan-sdk.exe; break }
            catch { "tentativo ${i}: $_"; if ($i -eq 5) { throw }; Start-Sleep -Seconds (10 * $i) }
          }
          Start-Process .\vulkan-sdk.exe -ArgumentList '--accept-licenses', '--default-answer', '--confirm-command', 'install' -Wait
          $sdk = (Get-ChildItem C:\VulkanSDK -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          "VULKAN_SDK=$sdk" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Get-ChildItem $sdk\Lib, $sdk\Bin | Select-Object -First 40 Name

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: trascrivi
          cache-targets: false

      - name: Motore Vulkan
        shell: pwsh
        run: powershell -File trascrivi\build.ps1 -SoloVulkan -Out ${{ github.workspace }}\dist-motori

      - name: "Prova di trascrizione (senza scheda video, ripiega sul processore)"
        shell: pwsh
        run: powershell -File trascrivi\prova.ps1 -Dir ${{ github.workspace }}\dist-motori

      - uses: actions/upload-artifact@v4
        with:
          name: motore-vulkan-arm64
          path: dist-motori/*.exe

  x64:
    name: Cedro x64 (prove, installatore, motori)
    if: ${{ !inputs.solo_pulizia }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Prove
        shell: pwsh
        run: cargo test --release

      - name: Prove dell'edizione Comune di Bondeno
        shell: pwsh
        run: cargo test --release --lib --features bondeno -- update edizione

      - name: "Prova su siti veri (Video dal web: Vimeo, Internet Archive)"
        shell: pwsh
        continue-on-error: true
        run: cargo test --release --lib real_sites -- --ignored --nocapture

      - name: Inno Setup
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe -OutFile is.exe
          $p = Start-Process .\is.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART' -Wait -PassThru
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe")) { throw "Inno Setup non installato ($($p.ExitCode))" }

      - name: Installatore x64, edizione Comune di Bondeno
        shell: pwsh
        run: powershell -File installer\build.ps1 -Bondeno

      - name: Installatore x64
        shell: pwsh
        run: powershell -File installer\build.ps1

      - name: "Aggiornamento vero: una 0.17 installata prende e installa l'installatore x64 nuovo"
        # Fino alla 0.17 Cedro prende il primo file «Cedro-Setup….exe» della release (GitHub li elenca in ordine
        # alfabetico): qui si rifà la stessa scelta sui nomi della release nuova e si installa sopra la 0.17.1.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{5C1CAEBF-024C-4A9F-BEC8-1FB3C9FEA4CE}_is1'
          gh release download v0.17.1 --pattern 'Cedro-Setup-*.exe' --dir vecchio
          Start-Process (Get-Item vecchio\Cedro-Setup-*.exe).FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART' -Wait
          "Installata: $((Get-ItemProperty $key).DisplayVersion)"
          if ((Get-ItemProperty $key).DisplayVersion -ne '0.17.1') { throw '0.17.1 non installata' }
          [string[]]$names = @("Cedro-ARM64-Setup-$version.exe", "Cedro-Bondeno-ARM64-Setup-$version.exe", "Cedro-Bondeno-Setup-$version.exe", "Cedro-Setup-$version.exe", "cedro-$version-linux-x64.tar.gz", "cedro-bondeno-$version-linux-x64.tar.gz")
          [Array]::Sort($names, [StringComparer]::Ordinal)
          $picked = $names | Where-Object { $_.StartsWith('Cedro-Setup') -and $_.EndsWith('.exe') } | Select-Object -First 1
          "La 0.17 sceglie: $picked"
          if ($picked -ne "Cedro-Setup-$version.exe") { throw "la 0.17 sceglierebbe $picked" }
          Start-Process (Get-Item "dist\$picked").FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART' -Wait
          Get-Process cedro -ErrorAction SilentlyContinue | Stop-Process -Force
          "Dopo l'aggiornamento: $((Get-ItemProperty $key).DisplayVersion)"
          if ((Get-ItemProperty $key).DisplayVersion -ne $version) { throw "aggiornamento a $version non riuscito" }

      - name: Motori x64 della release precedente con il nome nuovo
        # trascrivi/ per x64 non cambia: i motori già pubblicati si riusano col numero di versione nuovo.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path trascrivi\Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          New-Item -ItemType Directory -Force motori-x64 | Out-Null
          $tags = gh release list --limit 20 --json tagName --jq '.[].tagName'
          foreach ($tag in $tags) {
            gh release download $tag --pattern 'cedro-trascrivi-*-windows-x64-*.exe' --dir motori-x64 --clobber 2>$null
            if (Get-ChildItem motori-x64 -Filter *.exe -ErrorAction SilentlyContinue) { "Motori presi da $tag"; break }
          }
          foreach ($f in Get-ChildItem motori-x64 -Filter *.exe) {
            $new = $f.Name -replace '^cedro-trascrivi-[^-]+-windows', "cedro-trascrivi-$version-windows"
            if ($new -ne $f.Name) { Move-Item $f.FullName (Join-Path motori-x64 $new) -Force }
          }
          Get-ChildItem motori-x64
          if (-not (Get-ChildItem motori-x64 -Filter "*-$version-windows-x64-avx2.exe")) { throw 'motori x64 non trovati' }

      - uses: actions/upload-artifact@v4
        with:
          name: x64
          path: |
            dist/Cedro-Setup-*.exe
            dist/Cedro-Bondeno-Setup-*.exe
            motori-x64/*.exe

  pubblica:
    name: Pubblica la release
    if: ${{ always() && inputs.tag != '' && needs.app.result == 'success' && needs.motori.result == 'success' && needs.x64.result == 'success' }}
    needs: [app, motori, vulkan, x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: file
          merge-multiple: true

      # La release della versione ha solo i pacchetti da scaricare; i motori di trascrizione vanno in una
      # pre-release a parte («motori-v<versione>»), che Cedro legge da solo e che non diventa mai «latest».
      - name: Release ${{ inputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          find file -type f | sort
          V="${TAG#v}"
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$CARGO" != "$V" ]; then echo "Il tag $TAG non corrisponde alla versione $CARGO di Cargo.toml"; exit 1; fi
          if find file -type f -name '*.exe' | grep -v -- "$V" | grep .; then echo "File di un'altra versione"; exit 1; fi
          MOTORI="motori-$TAG"
          if ! gh release view "$MOTORI" >/dev/null 2>&1; then
            gh release create "$MOTORI" --target "$GITHUB_SHA" --prerelease --title "Motori di trascrizione ${TAG#v} (non servono: li scarica Cedro)" \
              --notes "Questi file non vanno scaricati a mano: Cedro li prende da qui la prima volta che trascrivi. Per installare Cedro vai su https://github.com/${GITHUB_REPOSITORY}/releases/latest"
          fi
          gh release upload "$MOTORI" $(find file -type f -name 'cedro-trascrivi-*') --clobber
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            sed "s/{versione}/${TAG#v}/g; s#{repo}#${GITHUB_REPOSITORY}#g" .github/note-release.md > note.md
            # Una bozza non crea il tag, e il workflow «Linux» fa il checkout del tag: lo creo prima.
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "$TAG" >/dev/null
            # In bozza: nessun Cedro la vede finché non ci sono i pacchetti di tutti i sistemi (job «apri»).
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --title "Cedro ${TAG#v}" --notes-file note.md
          fi
          gh release upload "$TAG" $(find file -type f -name 'Cedro-*Setup-*.exe') --clobber
          for t in "$TAG" "$MOTORI"; do echo "== $t"; gh release view "$t" --json assets --jq '.assets[] | "\(.name)  \(.digest)"'; done

      - name: Linux (tar.gz e motori) con il workflow «Linux»
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh workflow run linux.yml --ref "$GITHUB_REF_NAME" -f tag="$TAG"

  # Le versioni già installate non distinguono «manca ancora il mio pacchetto» da «non c'è»: la release
  # diventa pubblica (e «latest») solo quando ha i sei pacchetti, compresi i tar.gz del workflow «Linux».
  apri:
    name: Pubblica la release quando ci sono tutti i pacchetti
    needs: pubblica
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          V="${TAG#v}"
          want="Cedro-Setup-$V.exe Cedro-ARM64-Setup-$V.exe Cedro-Bondeno-Setup-$V.exe Cedro-Bondeno-ARM64-Setup-$V.exe cedro-$V-linux-x64.tar.gz cedro-bondeno-$V-linux-x64.tar.gz"
          for i in $(seq 1 90); do
            have=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            missing=""
            for f in $want; do grep -qxF "$f" <<<"$have" || missing="$missing $f"; done
            [ -z "$missing" ] && break
            echo "Mancano ancora:$missing"
            sleep 60
          done
          if [ -n "$missing" ]; then echo "La release resta in bozza: mancano$missing"; exit 1; fi
          gh release edit "$TAG" --draft=false --latest
          gh release view "$TAG" --json isDraft,assets --jq '"bozza: \(.isDraft)", (.assets[].name)'

  verifica:
    name: "Dopo la pubblicazione: una 0.17 vera si aggiorna da GitHub, la nuova trascrive"
    needs: apri
    runs-on: windows-latest
    steps:
      - name: Controlla aggiornamenti dalla 0.17.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{5C1CAEBF-024C-4A9F-BEC8-1FB3C9FEA4CE}_is1'
          gh release download v0.17.1 --repo $env:GITHUB_REPOSITORY --pattern 'Cedro-Setup-*.exe' --dir vecchio
          Start-Process (Get-Item vecchio\Cedro-Setup-*.exe).FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART' -Wait
          Get-Process cedro -ErrorAction SilentlyContinue | Stop-Process -Force
          $exe = Join-Path (Get-ItemProperty $key).InstallLocation 'cedro.exe'
          # «cedro update» della 0.17 vera: chiede conferma, scarica l'installatore scelto, controlla lo SHA-256 e lo avvia.
          $psi = New-Object Diagnostics.ProcessStartInfo $exe, 'update'
          $psi.UseShellExecute = $false
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $p = [Diagnostics.Process]::Start($psi)
          # Letture asincrone: l'installatore avviato da Cedro eredita stdout e lo tiene aperto finché non si chiude.
          $stdout = $p.StandardOutput.ReadToEndAsync()
          $stderr = $p.StandardError.ReadToEndAsync()
          $p.StandardInput.WriteLine('s'); $p.StandardInput.Close()
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw 'cedro update non finisce' }
          Start-Sleep -Seconds 3
          Get-Process | Where-Object { $_.ProcessName -like 'Cedro-*Setup*' } | ForEach-Object { Write-Host "Installatore avviato: $($_.ProcessName)"; $_ } | Stop-Process -Force
          $null = $stdout.Wait(30000); $null = $stderr.Wait(30000)
          $out = $stdout.Result + $stderr.Result
          $out
          if ($out -notmatch [regex]::Escape("Avviato Cedro-Setup-$version.exe")) { throw "la 0.17 non ha preso Cedro-Setup-$version.exe" }

      - name: La nuova trascrive con il motore della release dei motori
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{5C1CAEBF-024C-4A9F-BEC8-1FB3C9FEA4CE}_is1'
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern 'Cedro-Setup-*.exe' --dir nuovo
          Start-Process (Get-Item nuovo\Cedro-Setup-*.exe).FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART' -Wait
          Get-Process cedro -ErrorAction SilentlyContinue | Stop-Process -Force
          "Installata: $((Get-ItemProperty $key).DisplayVersion)"
          $exe = Join-Path (Get-ItemProperty $key).InstallLocation 'cedro.exe'
          $wav = Join-Path $env:RUNNER_TEMP 'frase.wav'
          powershell -Command "Add-Type -AssemblyName System.Speech; `$v = New-Object System.Speech.Synthesis.SpeechSynthesizer; `$v.SetOutputToWaveFile('$wav'); `$v.Speak('Good morning. The weather today is sunny and warm.'); `$v.Dispose()"
          $psi = New-Object Diagnostics.ProcessStartInfo $exe, "trascrivi `"$wav`" --testo --precisione veloce"
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $p = [Diagnostics.Process]::Start($psi)
          $err = $p.StandardError.ReadToEndAsync()
          $out = $p.StandardOutput.ReadToEndAsync()
          if (-not $p.WaitForExit(600000)) { $p.Kill(); throw 'la trascrizione non finisce' }
          $out.Result; $err.Result
          $txt = Get-ChildItem $env:RUNNER_TEMP -Recurse -Filter 'frase*.txt' | Select-Object -First 1
          if (-not $txt) { throw 'nessun testo' }
          Get-Content $txt.FullName
          if ((Get-Content $txt.FullName -Raw) -notmatch 'weather') { throw 'trascrizione sbagliata' }

  pulizia:
    name: Toglie i file di altre versioni dalla release
    if: ${{ inputs.solo_pulizia && inputs.tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          V="${TAG#v}"
          for t in "$TAG" "motori-$TAG"; do
            gh api "repos/$REPO/releases/tags/$t" --jq '.assets[] | "\(.id) \(.name)"' | while read -r id name; do
              case "$name" in
                *"$V"*) echo "tengo $t/$name" ;;
                *) echo "tolgo $t/$name"; gh api -X DELETE "repos/$REPO/releases/assets/$id" ;;
              esac
            done
          done
