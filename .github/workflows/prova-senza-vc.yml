name: Prova senza runtime (temporanea)

# TEMPORANEO: rifà solo il job «x64-senza-vcruntime» sugli artefatti già compilati dal giro 45157229680,
# per correggere la prova senza rifare due ore di build. Da togliere prima dell'unione.

on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/prova-senza-vc.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  x64-senza-vcruntime:
    name: Cedro x64 (parte su un Windows senza il runtime di Visual C++)
    # Su GitHub, usa e getta: le DLL del runtime si tolgono da System32 (e a fine prova si rimettono).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: x64
          run-id: 45157229680
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Senza vcruntime140.dll e msvcp140.dll: installatore, Cedro, portable e motori partono (come su un notebook pulito)"
        shell: pwsh
        run: |
          # Il guasto della 0.58.0: su un Windows appena installato cedro.exe non partiva («VCRUNTIME140.dll non è
          # stato trovato»). Qui si toglie da System32 il runtime di Visual C++ (i runner ce l'hanno), si riduce PATH
          # al minimo (altrimenti il caricatore trova le DLL di Python o di Visual Studio) e si prova tutto davvero.
          $ErrorActionPreference = 'Stop'
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $work = Join-Path $env:RUNNER_TEMP 'senza-vc'
          New-Item -ItemType Directory -Force "$work\in", "$work\terzi" | Out-Null

          # --- Preparazione, finché Windows ha ancora il runtime ---
          # Lo strumento che elenca le DLL importate (runtime dentro: parte anche senza) e un programma di controllo
          # uguale ma con il runtime in DLL: senza vcruntime140.dll NON deve partire, altrimenti la prova non vale.
          rustc -O --edition 2021 -C target-feature=+crt-static tools\dipendenze-pe.rs -o "$work\dipendenze.exe"
          if ($LASTEXITCODE -ne 0) { throw 'dipendenze.exe non compilato' }
          rustc -O --edition 2021 -C target-feature=-crt-static tools\dipendenze-pe.rs -o "$work\controllo.exe"
          if ($LASTEXITCODE -ne 0) { throw 'controllo.exe non compilato' }
          Expand-Archive "dist\Cedro-Portable-$v-x64.zip" -DestinationPath "$work\portable"
          Copy-Item tests\fixtures\scan.jpg "$work\in\scan.jpg"
          $setup = (Get-Item "dist\Cedro-Setup-$v.exe").FullName
          $portable = Join-Path $work 'portable\Cedro-Portable\cedro.exe'
          $mine = Join-Path $env:LOCALAPPDATA 'Programs\Cedro\cedro.exe'
          # I programmi che Cedro scarica la prima volta che servono (video dal web): gli stessi file che prende lui.
          $terzi = @{}
          try {
            $dl = 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe'
            Invoke-WebRequest $dl -OutFile "$work\terzi\yt-dlp.exe"
            $terzi['yt-dlp'] = "$work\terzi\yt-dlp.exe"
            Invoke-WebRequest 'https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip' -OutFile "$work\deno.zip"
            Expand-Archive "$work\deno.zip" -DestinationPath "$work\terzi\deno"
            $terzi['deno'] = "$work\terzi\deno\deno.exe"
            Invoke-WebRequest 'https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-lgpl.zip' -OutFile "$work\ffmpeg.zip"
            Expand-Archive "$work\ffmpeg.zip" -DestinationPath "$work\terzi\ffmpeg"
            $terzi['ffmpeg'] = (Get-ChildItem "$work\terzi\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          } catch { "Componenti di terzi non scaricati ($_): salto quella parte" }

          $sys = Join-Path $env:WINDIR 'System32'
          $nascoste = New-Object System.Collections.Generic.List[string]
          $errori = New-Object System.Collections.Generic.List[string]
          $avvisi = New-Object System.Collections.Generic.List[string]
          function Nascondi {
            foreach ($m in 'vcruntime140*.dll', 'msvcp140*.dll', 'concrt140.dll', 'vcomp140.dll', 'vccorlib140.dll') {
              foreach ($f in [IO.Directory]::GetFiles($sys, $m)) {
                & "$sys\takeown.exe" /f $f | Out-Null
                & "$sys\icacls.exe" $f /grant 'Administrators:F' | Out-Null
                [IO.File]::Move($f, "$f.nascosta")
                $nascoste.Add($f)
              }
            }
          }
          function Ripristina { foreach ($f in $nascoste) { if (Test-Path "$f.nascosta") { [IO.File]::Move("$f.nascosta", $f) } } }
          function Esegui([string]$exe, [string[]]$par = @(), [int]$attesa = 120000) {
            $psi = New-Object Diagnostics.ProcessStartInfo $exe
            foreach ($a in $par) { $psi.ArgumentList.Add($a) }
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $psi.WorkingDirectory = "$work\in"
            $p = [Diagnostics.Process]::Start($psi)
            $o = $p.StandardOutput.ReadToEndAsync(); $e = $p.StandardError.ReadToEndAsync()
            if (-not $p.WaitForExit($attesa)) { $p.Kill(); return [pscustomobject]@{ Codice = 'timeout'; Testo = '' } }
            $null = $o.Wait(20000); $null = $e.Wait(20000)
            [pscustomobject]@{ Codice = $p.ExitCode; Testo = ($o.Result + $e.Result).Trim() }
          }
          $pathPrima = $env:PATH
          try {
            Nascondi
            "Nascoste: " + (($nascoste | ForEach-Object { Split-Path $_ -Leaf }) -join ', ')
            if (-not $nascoste.Count) { throw 'non ho trovato il runtime di Visual C++ da nascondere: prova non valida' }
            $env:PATH = "$sys;$env:WINDIR"

            "== Controllo: un programma con il runtime in DLL qui NON deve partire (altrimenti la prova non vale)"
            $c = Esegui "$work\controllo.exe" @("$work\dipendenze.exe") 15000
            "   codice: $($c.Codice)"
            if ($c.Codice -eq 0) { $errori.Add('PROVA NON VALIDA: un programma che vuole vcruntime140.dll parte lo stesso') }

            "== DLL importate dai file che distribuiamo"
            $dist = @($portable, $setup) + @(Get-ChildItem motori-x64\*.exe | ForEach-Object FullName)
            $r = Esegui "$work\dipendenze.exe" $dist
            $r.Testo
            if ($r.Codice -ne 0) { $errori.Add('un file dipende dalle DLL di Visual C++') }

            "== Installatore silenzioso"
            $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART', "/LOG=$work\setup.log" -PassThru
            if (-not $p.WaitForExit(240000)) { $p.Kill(); $errori.Add('l''installatore non finisce') }
            Start-Sleep 3
            Get-Process cedro -ErrorAction SilentlyContinue | Stop-Process -Force
            if (-not (Test-Path $mine)) { $errori.Add("l'installatore non ha messo $mine (codice $($p.ExitCode))") }

            if (Test-Path $mine) {
              "== Cedro installato: la finestra parte e resta aperta"
              $g = Start-Process $mine -PassThru
              Start-Sleep 12
              if ($g.HasExited) { $errori.Add("cedro.exe installato si è chiuso da solo (codice $($g.ExitCode))") } else { "   ok, in esecuzione" }
              Get-Process cedro -ErrorAction SilentlyContinue | Stop-Process -Force
            }
            foreach ($exe in @($mine, $portable)) {
              if (-not (Test-Path $exe)) { continue }
              "== ${exe}: converte una foto"
              Remove-Item "$work\in\*.png" -ErrorAction SilentlyContinue
              $r = Esegui $exe @('--quality', '80', 'convert', "$work\in\scan.jpg", 'png')
              "   codice $($r.Codice): $($r.Testo)"
              if ($r.Codice -ne 0 -or -not (Get-ChildItem "$work\in\*.png")) { $errori.Add("$exe non converte") }
            }

            "== Motori: partono senza il runtime (--version)"
            foreach ($exe in Get-ChildItem motori-x64\*.exe | Where-Object Name -Match '-(base|avx2)\.exe$') {
              $r = Esegui $exe.FullName @('--version') 30000
              "   $($exe.Name): codice $($r.Codice), $($r.Testo)"
              if ($r.Codice -ne 0 -or $r.Testo -ne $v) { $errori.Add("$($exe.Name) non parte ($($r.Codice))") }
            }

            "== Programmi di terzi che Cedro scarica (solo avviso: non sono nostri)"
            $conArg = @{ 'yt-dlp' = '--version'; 'deno' = '--version'; 'ffmpeg' = '-version' }
            foreach ($n in $terzi.Keys) {
              $r = Esegui $terzi[$n] @($conArg[$n]) 90000
              $riga = ($r.Testo -split "`r?`n" | Select-Object -First 1)
              "   ${n}: codice $($r.Codice), $riga"
              if ($r.Codice -ne 0) { $avvisi.Add("$n non parte senza il runtime di Visual C++ (codice $($r.Codice))") }
              $d = Esegui "$work\dipendenze.exe" @($terzi[$n])
              $d.Testo
            }
          } finally {
            $env:PATH = $pathPrima
            Ripristina
          }
          foreach ($a in $avvisi) { Write-Host "::warning::$a" }
          foreach ($e in $errori) { Write-Host "::error::$e" }
          if ($errori.Count) { throw "Senza il runtime di Visual C++: $($errori -join '; ')" }
          'Tutto parte anche senza il runtime di Visual C++.'
