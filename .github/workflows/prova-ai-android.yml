# Prova temporanea: llama-bench per Android arm64, per misurare il Riassunto AI sul telefono (Mi 9T).
name: Prova AI Android

on:
  push:
    branches: ["claude/project-thread-xwhhfg"]
    paths: [".github/workflows/prova-ai-android.yml"]

env:
  ANDROID_SDK: /opt/android-sdk
  NDK_VERSION: 27.2.12479018

jobs:
  bench:
    runs-on: ubuntu-24.04
    steps:
      - name: NDK
        run: |
          sudo mkdir -p "$ANDROID_SDK" && sudo chown "$USER" "$ANDROID_SDK"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK" "ndk;$NDK_VERSION" >/dev/null
          sudo apt-get install -y --no-install-recommends ninja-build
      - name: llama.cpp per Android
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp
          cd llama.cpp
          git log -1 --format='%H %cd' > ../versione.txt
          cmake -S . -B b -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK/ndk/$NDK_VERSION/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release -DGGML_OPENMP=OFF -DGGML_NATIVE=OFF \
            -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16 -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_CURL=OFF -DLLAMA_BUILD_SERVER=OFF
          cmake --build b -j4 --target llama-bench llama-cli llama-simple
          mkdir ../out && cp b/bin/llama-bench b/bin/llama-cli b/bin/llama-simple ../out/ && cp ../versione.txt ../out/
          ls -la ../out
      - uses: actions/upload-artifact@v4
        with:
          name: llama-android-arm64
          path: out/
