name: Android F-Droid

# Repository F-Droid di Cedro (https://realfulvio.github.io/cedro/fdroid/repo): ogni release «android-v*» pubblicata
# aggiorna l'indice e lo mette su GitHub Pages. Gli APK sono quelli firmati dalla CI «Android» (la chiave dell'app),
# l'indice è firmato con una chiave a parte (quella del repository).
# Secret: FDROID_KEYSTORE_B64 (keystore del repository in base64), FDROID_KS_PASS. Pages va attivato: Settings → Pages → «GitHub Actions».
# Parte a mano, quando si pubblica una release, quando cambia la cartella site/ su main e ogni 6 ore (per il sito).

on:
  release:
    types: [published]
  # Il sito (cartella site/) esce nello stesso deploy di Pages: ogni deploy sostituisce tutto, quindi il repository
  # F-Droid va rifatto insieme al sito, altrimenti /fdroid/repo sparirebbe.
  push:
    branches: [main]
    paths: ["site/**", "tools/aggiorna-sito.py"]
  # Le release desktop le crea la CI e non fanno partire altri workflow: il sito controlla da solo, ogni 6 ore,
  # se c'è una versione nuova da mettere nella pagina «Scarica».
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag Android da cui prendere i metadati (es. android-v0.21.3)"
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  repo:
    if: ${{ github.event_name != 'release' || startsWith(github.event.release.tag_name, 'android-v') || startsWith(github.event.release.tag_name, 'v') }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # I metadati F-Droid stanno nel ramo/tag Android; il workflow può girare anche da main.
          ref: ${{ inputs.ref || github.event.release.tag_name }}
      - name: fdroidserver
        timeout-minutes: 15
        run: |
          export DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a
          sudo -E apt-get update -qq && sudo -E apt-get install -y -qq apksigner >/dev/null
          python3 -m venv "$RUNNER_TEMP/fdroid" && "$RUNNER_TEMP/fdroid/bin/pip" install -q fdroidserver
          echo "$RUNNER_TEMP/fdroid/bin" >> "$GITHUB_PATH"
      - name: Prepara il repository
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.FDROID_KS_PASS }}
        run: |
          set -euo pipefail
          mkdir -p fdroid/repo fdroid/metadata && cd fdroid
          cp -r ../android/fdroid/metadata/. metadata/
          # Gli ultimi APK delle release Android pubblicate (non le bozze).
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 10 --exclude-drafts --json tagName --jq '.[].tagName | select(startswith("android-v"))'); do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'cedro-*.apk' --dir repo --clobber || true
          done
          ls repo
          # La versione consigliata è sempre l'APK più nuovo: altrimenti F-Droid lo segna come «beta».
          ultimo=$(ls repo/cedro-*.apk | sed 's/.*cedro-\(.*\)\.apk/\1/' | sort -V | tail -1)
          IFS=. read -r v1 v2 v3 <<< "$ultimo"
          sed -i "s/^CurrentVersion: .*/CurrentVersion: $ultimo/; s/^CurrentVersionCode: .*/CurrentVersionCode: $((v1 * 10000 + v2 * 100 + v3))/" metadata/it.cedro.android.yml
          grep -E "^CurrentVersion" metadata/it.cedro.android.yml
          echo "$KEYSTORE_B64" | base64 -d > keystore.p12
          cat > config.yml <<CFG
          repo_url: https://realfulvio.github.io/cedro/fdroid/repo
          repo_name: Cedro
          repo_description: "Cedro per Android, converti file e trascrivi la voce, tutto sul telefono."
          archive_older: 0
          keystore: keystore.p12
          repo_keyalias: cedro-repo
          keystorepass: $KS_PASS
          keypass: $KS_PASS
          keydname: CN=Cedro F-Droid repo, O=Cedro
          CFG
          sed -i 's/^          //' config.yml
          chmod 600 config.yml
          fdroid update
          rm -f keystore.p12 config.yml
      - name: Sito (sempre l'ultimo di main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: _main
      - name: Pubblica sito e repository F-Droid
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/fdroid && cp -r fdroid/repo _site/fdroid/
          cp -r _main/site/. _site/
          touch _site/.nojekyll
          # Versione, file, dimensioni e data dell'ultima release desktop (se non si legge, resta la pagina com'è).
          python3 _main/tools/aggiorna-sito.py _site/index.html
          python3 _main/tools/aggiorna-sito.py _site/en/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
