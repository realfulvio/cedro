[package]
name = "cedro-trascrivi"
version = "0.26.9"
edition = "2021"
license = "MIT"
description = "Il motore di trascrizione di Cedro (whisper.cpp): Cedro lo scarica alla prima trascrizione."
publish = false

# Programma a parte, fuori dal workspace di Cedro: compilarlo richiede cmake e un compilatore C++.
[workspace]

[features]
# Il motore con la scheda video (Vulkan: NVIDIA, AMD e Intel, anche integrate). Serve il Vulkan SDK per compilarlo.
vulkan = ["whisper-rs/vulkan"]

[dependencies]
opus = "0.4"
serde_json = "1"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "mp1", "mp2", "wav", "flac", "vorbis", "pcm", "adpcm", "aac", "alac", "isomp4", "ogg", "mkv", "aiff", "caf"] }
whisper-rs-sys = "0.15"
whisper-rs = { version = "0.16" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Su Windows ARM64 il motore si compila con clang-cl (ggml), e con clang-cl le parti ARM di libopus 1.6.1
# scritte per MSVC non compilano (celt/arm/armcpu.c usa __emit; celt_neon_intr.c non trova
# celt_inner_prod_neon). Il motore decodifica solo l'audio Opus da trascrivere: qui libopus va in C semplice.
[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
opusic-sys = { version = "0.7.6", features = ["no-simd", "no-runtime-feature-detection"] }

[profile.release]
lto = true
strip = true
