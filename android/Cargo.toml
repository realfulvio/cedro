[package]
name = "cedro-android"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Prototipo Android di Cedro: la ruota a schermo intero e «Condividi con Cedro»."

[lib]
name = "cedro_android"
crate-type = ["cdylib", "rlib"]

[features]
# YouTube con yt-dlp: mette nell'APK Python, QuickJS e ffmpeg precompilati da youtubedl-android
# (android/build.sh con CEDRO_YOUTUBE=1). Spento per il catalogo F-Droid, che costruisce solo da sorgente.
youtube = []

[dependencies]
cedro = { path = ".." }
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
jni = "0.21"
android_logger = "0.14"
