<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Percorso guidato, passo 2</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./rework.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
<style>
body{margin:0}
.st{display:flex;align-items:center;gap:6px;padding:4px 16px 0}
.st .n{width:30px;height:30px;border-radius:15px;border:2px solid var(--mu);color:var(--mu);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none}
.st .n.on{background:var(--pr);border-color:var(--pr);color:var(--on)}
.st .n.ok{background:var(--alt);border-color:var(--pr);color:var(--pr)}
.st .l{font-size:14px;color:var(--mu)}
.st .l.on{color:var(--pr);font-weight:700}
.st .ln{flex:1;height:2px;background:var(--bd);min-width:10px}
.st .ln.ok{background:var(--pr)}
.cc{background:var(--sf);border:1.5px solid var(--bd);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px;text-align:left}
.cc b{font-size:18px}
.cc span{font-size:13px;color:var(--mu)}
.cc.on{border:2px solid var(--pr);background:var(--alt)}
.ic{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:22px;flex:none}
</style>
</helmet>
<div class="rw gui">
<div style="display: flex; align-items: center; height: 56px; padding: 0 4px 0 16px; gap: 10px; flex: none">
<div class="logo"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="#793FCB" stroke-width="3.4"/><path d="M12 12L21 9.5A9 9 0 0 1 17.5 19.2z" fill="#14845B"/></svg></div>
<button style="height: 40px; padding: 0 12px; border: 1px solid var(--bd); border-radius: 8px; background: var(--sf); display: flex; align-items: center; gap: 8px; font-size: 15px"><span class="kt k-conv"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h14l-4-4M20 16H6l4 4"/></svg></span>Conversioni <span class="mu">▾</span></button>
<button class="ic" aria-label="Guida" style="margin-left: auto"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5M12 17v.01"/></svg></button>
<button class="ic" aria-label="Impostazioni"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
</div>
<div class="st"><span class="n ok">1</span><span class="l">File</span><span class="ln ok"></span><span class="n on">2</span><span class="l on">Operazione</span><span class="ln"></span><span class="n">3</span><span class="l">Salvataggio</span></div>
<div style="flex: 1; overflow: hidden; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 10px">
<h1 style="margin: 0; font-size: 30px; line-height: 1.15; font-weight: 700">Cosa vuoi ottenere?</h1>
<div class="mu" style="font-size: 16px">Scegli il formato di destinazione.</div>
<div style="display: flex; align-items: center; gap: 12px; background: var(--sf); border: 1px solid var(--bd); border-radius: 10px; padding: 10px 12px">
<div style="display: flex"><span class="th a" style="width: 34px; height: 34px"></span><span class="th b" style="width: 34px; height: 34px; margin-left: -14px; box-shadow: 0 0 0 2px var(--sf)"></span><span class="th c" style="width: 34px; height: 34px; margin-left: -14px; box-shadow: 0 0 0 2px var(--sf)"></span></div>
<div style="flex: 1"><b class="k-img kc">3 immagini</b><div class="mu" style="font-size: 13px">JPG · 201 KB in tutto</div></div>
<button style="color: var(--pr); font-weight: 700; font-size: 15px; height: 44px">Cambia file</button>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button class="cc on"><span style="display: flex; align-items: center; gap: 8px"><span class="kt k-img"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18v14H3zM21 15l-5-5-9 9M9 9.5v.01"/></svg></span><b>PNG</b></span><span>Senza perdita, con la trasparenza</span></button>
<button class="cc"><span style="display: flex; align-items: center; gap: 8px"><span class="kt k-img"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18v14H3zM21 15l-5-5-9 9M9 9.5v.01"/></svg></span><b>JPEG</b></span><span>Più leggera, per le foto</span></button>
<button class="cc"><span style="display: flex; align-items: center; gap: 8px"><span class="kt k-img"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18v14H3zM21 15l-5-5-9 9M9 9.5v.01"/></svg></span><b>WebP</b></span><span>Per il web</span></button>
<button class="cc"><span style="display: flex; align-items: center; gap: 8px"><span class="kt k-pdf"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M8 14h8M8 17h5"/></svg></span><b>PDF</b></span><span>Un foglio per immagine</span></button>
</div>
<div style="font-size: 15px"><span class="mu">Impostazioni consigliate · Converti in PNG</span></div>
<div style="background: var(--sf); border: 1px solid var(--bd); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 8px"><b style="flex: 1">Opzioni di conversione · PNG</b></div>
<div class="sel">Altri formati e strumenti<span class="ch">▾</span></div>
<div style="display: flex; align-items: center"><div style="flex: 1"><div>Raddrizza le foto</div><div class="mu" style="font-size: 13px">Corregge la rotazione dei file del telefono</div></div><span class="sw2"></span></div>
</div>
</div>
<div style="flex: none; padding: 12px 16px 18px; border-top: 1px solid var(--bd); display: flex; gap: 10px">
<button style="flex: 1; height: 54px; border: 1px solid var(--bd); border-radius: 6px; background: var(--sf); font-size: 17px; font-weight: 700">Indietro</button>
<button class="cta" style="flex: 1.6; border-radius: 6px">Continua<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</div>
</div>
</x-dc>
