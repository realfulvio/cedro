'TC, RX, ecografie; finestra Polmone, Osso, Tessuti molli; anche anonimizzato':'CT, X-ray, ultrasound; Lung, Bone, Soft tissue windows; anonymised too','Vetrini Aperio':'Aperio slides','Vetrini Hamamatsu':'Hamamatsu slides','Vetrini 3DHistech':'3DHistech slides','Anche TIFF di ImageJ e a 16 bit':'ImageJ and 16-bit TIFF too',

let L='it';
const t=s=>L==='en'&&EN[s]||s;
const ZIPL={webp:'Foto in WebP',jpeg:'Foto in JPEG',png:'Foto in PNG',mp3:'Audio in MP3',wav:'Audio in WAV',pdf:'Documenti in PDF'};
const TRL={docx:'documento',txt:'testo semplice',srt:'sottotitoli',vtt:'sottotitoli web'};
let sel='HEIC',q='',ff='all';
const $=s=>document.querySelector(s);
const fch=$('#fch'),isLab=f=>f.id==='lab';
function chips(){fch.innerHTML='';
 const all=document.createElement('button');all.textContent=t('Tutti');all.style.setProperty('--c','#6B4A9E');all.setAttribute('aria-pressed',ff==='all');all.onclick=()=>{ff='all';draw()};fch.append(all);
 FAM.forEach(f=>{const b=document.createElement('button');b.style.setProperty('--c',f.c);b.style.setProperty('--k',f.ink);b.setAttribute('aria-pressed',ff===f.id);b.innerHTML=t(f.name)+'<b>'+IN.filter(x=>x[1]===f.id).length+'</b>';b.onclick=()=>{ff=ff===f.id?'all':f.id;draw()};fch.append(b)});}
function draw(){chips();const List=$('#list');List.innerHTML='';let first=null;
 FAM.forEach(f=>{if(ff!=='all'&&ff!==f.id)return;const items=IN.filter(x=>x[1]===f.id&&(!q||x[0].toLowerCase().includes(q)));if(!items.length)return;
  const g=document.createElement('section');g.className='grp';g.style.setProperty('--c',f.c);
  g.innerHTML='<h2><i></i>'+t(f.name)+(isLab(f)?'<span class="beta">Cedro 4 Labs beta</span>':'')+' <small>'+t(f.blurb)+'</small></h2>';
  const w=document.createElement('div');w.className='fm';
  items.forEach(x=>{if(!first)first=x[0];const b=document.createElement('button');b.type='button';b.textContent=x[0];b.style.setProperty('--c',f.c);b.style.setProperty('--k',f.ink);b.setAttribute('aria-pressed',x[0]===sel);b.onclick=()=>{sel=x[0];draw()};w.append(b)});
  g.append(w);List.append(g)});
 if(!first)List.innerHTML='<p class="none">'+t('Nessun formato con questo nome. Se manca qualcosa che ti serve, puoi segnalarlo su GitHub.')+'</p>';
 panel(IN.find(x=>x[0]===sel)||IN[0]);
 $('#q').placeholder=t('Per esempio heic, docx, svs…');$('#q').setAttribute('aria-label',t('Cerca un formato'));}
function panel(it){const f=fam(it[1]),p=$('#panel');p.style.setProperty('--c',f.c);p.style.setProperty('--k',f.ink);p.classList.toggle('ly',isLab(f));
 const av=it[1]==='aud'||it[1]==='vid';
 const tr=av?it[2].filter(k=>TR.includes(k)):[],rest=av?it[2].filter(k=>!TR.includes(k)):it[2];
 let h='<div class="tag">'+t(f.name)+'</div><h3>'+it[0]+'</h3><p class="nt">'+t(it[3]||f.blurb)+'</p>';
 h+='<h4>'+t('Diventa')+'</h4><div class="dest">'+rest.map(k=>'<span>'+t(it[1]==='zip'?ZIPL[k]:OUT[k])+'</span>').join('')+'</div>';
 if(tr.length)h+='<h4>'+t('Trascrizione, in locale')+'</h4><div class="dest">'+tr.map(k=>'<span>'+t(OUT[k])+'<small>'+t(TRL[k])+'</small></span>').join('')+'</div>';
 const tools=[...new Set(f.tools.concat(PLUS[it[1]]||[],PLUSF[it[0]]||[]))];
 h+='<h4>'+t('Strumenti per questo file')+'</h4><ul class="tl">'+tools.map(x=>'<li>'+t(x)+'</li>').join('')+'</ul>';
 p.innerHTML=h;}
$('#q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase().replace(/^\./,'');const m=IN.filter(x=>x[0].toLowerCase().includes(q));if(q&&m.length)sel=m[0][0];draw()});
function setL(l){L=l;document.documentElement.lang=l;
 document.querySelectorAll('[data-it]').forEach(e=>{e.innerHTML=l==='en'?e.dataset.en:e.dataset.it});document.querySelectorAll('.cnt').forEach(e=>e.textContent=IN.length);
 draw();}
window.cedroSet=setL;
setL(document.documentElement.getAttribute('data-static')==='en'?'en':'it');
</script>
