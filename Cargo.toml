[package]
name = "cedro"
version = "0.26.9"
edition = "2021"
license = "MIT"
description = "Converti e modifica file in locale, con una ruota al cursore. Windows e Linux."
publish = false

[dependencies]
cfb = "0.7"
hound = "3.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp", "tiff", "ico", "tga", "qoi", "pnm", "hdr", "exr", "dds"] }
hayro = "0.8"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
lopdf = "0.46"
mp4 = "0.14"
skrifa = "0.49"
mp3lame-encoder = "0.2"
ocrs = "0.13"
png = "0.18"
oxideav-vp8 = { version = "0.2.7", default-features = false }
oxideav-vp9 = "0.0.13"
oxideav-mpeg4video = "0.1"
rten = "0.26"
rten-simd = "0.26"
serde_json = "1"
sha2 = "0.10"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "flac", "vorbis", "pcm", "aac", "isomp4", "ogg", "mkv", "aiff", "caf", "adpcm"] }
ureq = "2"
# Formati di foto in più, tutti in Rust: SVG (resvg), AVIF (ravif per scrivere, avif-decode/rav1d per leggere), JPEG XL (jxl-oxide per leggere, zune-jpegxl per scrivere); FLAC in scrittura (flacenc).
resvg = { version = "0.49", default-features = false, features = ["text", "system-fonts"] }
ravif = { version = "0.13", default-features = false }
avif-decode = { version = "3", default-features = false }
jxl-oxide = { version = "0.12", default-features = false }
zune-jpegxl = { version = "0.5", default-features = false, features = ["std"] }
zune-core = { version = "0.5", default-features = false }
flacenc = { version = "0.5", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }

# Il tasto Play dell'anteprima: l'uscita audio del sistema (ALSA su Linux, WASAPI su Windows).
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
cpal = "0.15"

# Opus (audio dei WebM, vocali di WhatsApp e Telegram): libopus compilata dentro il programma.
[target.'cfg(any(windows, target_os = "linux", target_os = "android"))'.dependencies]
audiopus_sys = { version = "0.2", features = ["static"] }

[target.'cfg(target_os = "linux")'.dependencies]
fdk-aac = "0.8"
libc = "0.2"
gtk4 = { version = "0.10", features = ["v4_12"] }
ksni = "0.2"
mp4 = "0.14"
openh264 = { version = "0.9", default-features = false, features = ["source"] }

# Android: stesso video di Linux (OpenH264, fdk-aac, MP4/MKV in Rust); la scheda video è MediaCodec (src/mediacodec.rs).
[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", features = ["media"] }
ndk-sys = { version = "0.6", features = ["media"] }
fdk-aac = "0.8"
libc = "0.2"
mp4 = "0.14"
openh264 = { version = "0.9", default-features = false, features = ["source"] }
# whisper.cpp come libreria nell'APK (src/whisper_android).
whisper-rs = "0.16"
whisper-rs-sys = "0.15"

[target.'cfg(windows)'.dependencies]
windows-core = "0.61"
windows = { version = "0.61", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Security_Cryptography",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# hayro con l'opzione per disegnare la pagina senza testo (sfondo dei moduli in Word)
[patch.crates-io]
hayro = { path = "vendor/hayro" }
# rten-simd con l'interruttore per spegnere AVX-512 (Impostazioni)
rten-simd = { path = "vendor/rten-simd" }
# rav1d (lettura delle foto AVIF) senza l'assembly: niente nasm da installare
rav1d = { path = "vendor/rav1d" }

# Prototipo Android (NativeActivity, tutto Rust): vedi android/README.md
[workspace]
members = ["android"]

# Binario più piccolo e più veloce: ottimizzazione tra le crate (LTO) e simboli di debug tolti.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
